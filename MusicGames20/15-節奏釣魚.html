<body>
<div id="game">
  <div id="hud">
    <span>分數：<span id="score">0</span></span>
    <span>連擊：<span id="combo">0</span></span>
    <span>最高：<span id="best">0</span></span>
  </div>
  <canvas id="cv"></canvas>
  <div id="controls">
    <button id="reel-btn">收線 (空白鍵)</button>
  </div>
  <div id="startScreen" class="overlay">
    <h1>節奏釣魚</h1>
    <p>魚兒會隨著節奏遊動<br>當魚兒進入綠色目標區域時，點選「收線」釣起牠！<br>釣到不同的魚會彈出不同音階<br>時機越準，分數越高<br>鍵盤空白鍵也可以收線</p>
    <button id="startBtn">開始釣魚</button>
  </div>
  <div id="endScreen" class="overlay hidden">
    <h2>釣魚結束</h2>
    <div class="stats">
      本局分數：<b id="finalScore">0</b><br>
      最高連擊：<b id="finalCombo">0</b><br>
      歷史最高：<b id="finalBest">0</b>
    </div>
    <button id="restartBtn">再來一局</button>
  </div>
</div>
<script>
const AC=window.AudioContext||window.webkitAudioContext;
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume()}
function playNote(freq,dur=.3,type='sine',vol=.25){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
}
function playSplash(){
  if(!audioCtx)return;
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*.2,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/1500);
  const src=audioCtx.createBufferSource(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();
  f.type='bandpass';f.frequency.value=1000;f.Q.value=2;
  src.buffer=buf;src.connect(f);f.connect(g);g.connect(audioCtx.destination);
  g.gain.setValueAtTime(.2,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.2);
  src.start();
}
const FISH_TYPES=[
  {name:'小鯽魚',color:'#ffa',freq:523.25,score:50,size:15},
  {name:'吳郭魚',color:'#f80',freq:440,score:80,size:20},
  {name:'鱸魚',color:'#0af',freq:392,score:120,size:25},
  {name:'鮭魚',color:'#f66',freq:349.23,score:180,size:30},
  {name:'金槍魚',color:'#4af',freq:293.66,score:250,size:35},
  {name:'鯊魚',color:'#888',freq:261.63,score:400,size:45},
];
const cv=document.getElementById('cv');const ctx=cv.getContext('2d');
let W,H;
function resize(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);}
window.addEventListener('resize',resize);
const game={score:0,combo:0,maxCombo:0,running:false,fish:null,targetZone:{x:0,w:80},reelTimer:0,canReel:false,lastTime:0,missCount:0,bubbles:[],caughtAnim:null};
const scoreEl=document.getElementById('score');
const comboEl=document.getElementById('combo');
const reelBtn=document.getElementById('reel-btn');
let best=0;
try{best=parseInt(localStorage.getItem('rhythmFishing_best')||'0')}catch(e){}
document.getElementById('best').textContent=best;

function spawnFish(){
  const type=FISH_TYPES[Math.floor(Math.random()*FISH_TYPES.length)];
  const y=H*0.3+Math.random()*H*0.5;
  game.fish={type,x:-50,y,dir:1,speed:1.5+Math.random()*1.5,wobble:Math.random()*Math.PI*2};
  game.targetZone.w=100-type.size*1.2;
  game.targetZone.x=W*0.3+Math.random()*W*0.3;
  game.canReel=true;
}
function reel(){
  if(!game.running||!game.canReel||!game.fish)return;
  initAudio();
  game.canReel=false;
  const fish=game.fish;
  const zoneCenter=game.targetZone.x+game.targetZone.w/2;
  const dist=Math.abs(fish.x-zoneCenter);
  const inZone=fish.x>game.targetZone.x&&fish.x<game.targetZone.x+game.targetZone.w;
  if(inZone){
    let points=fish.type.score;
    let judge='GOOD';
    if(dist<game.targetZone.w*0.2){points*=2;judge='PERFECT';}
    game.score+=Math.floor(points);
    game.combo++;game.maxCombo=Math.max(game.maxCombo,game.combo);
    playNote(fish.type.freq,.4,'sine',.3);
    playSplash();
    game.caughtAnim={x:fish.x,y:fish.y,type:fish.type,life:1,judge};
    fish.caught=true;
    if(game.combo%5===0){}
  }else{
    game.combo=0;game.missCount++;
    playNote(100,.2,'sawtooth',.15);
    if(game.missCount>=10){endGame();return;}
  }
  scoreEl.textContent=game.score;comboEl.textContent=game.combo;
  setTimeout(()=>{if(game.running)spawnFish();},800);
}
function drawFish(fish){
  ctx.save();
  ctx.translate(fish.x,fish.y+Math.sin(fish.wobble)*5);
  if(fish.dir<0)ctx.scale(-1,1);
  const s=fish.type.size;
  ctx.fillStyle=fish.type.color;
  ctx.shadowColor=fish.type.color;ctx.shadowBlur=10;
  ctx.beginPath();
  ctx.ellipse(0,0,s,s*0.6,0,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-s*0.8,0);ctx.lineTo(-s*1.4,-s*0.5);ctx.lineTo(-s*1.4,s*0.5);ctx.closePath();
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(s*0.4,-s*0.15,s*0.15,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.arc(s*0.45,-s*0.15,s*0.08,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0a2a4e');grad.addColorStop(.3,'#0a3a5e');grad.addColorStop(1,'#0a1a3e');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.03)';
  for(let i=0;i<5;i++){
    ctx.beginPath();
    ctx.ellipse(W*0.2+i*W*0.2,H*0.15,60,15,0,0,Math.PI*2);
    ctx.fill();
  }
  for(const b of game.bubbles){
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();
  }
  if(game.canReel&&game.fish&&!game.fish.caught){
    ctx.fillStyle='rgba(0,255,0,.15)';
    ctx.fillRect(game.targetZone.x,H*0.2,game.targetZone.w,H*0.65);
    ctx.strokeStyle='#0f0';ctx.lineWidth=2;ctx.setLineDash([5,5]);
    ctx.strokeRect(game.targetZone.x,H*0.2,game.targetZone.w,H*0.65);
    ctx.setLineDash([]);
    ctx.fillStyle='#0f0';ctx.font='bold 12px sans-serif';ctx.textAlign='center';
    ctx.fillText('目標區',game.targetZone.x+game.targetZone.w/2,H*0.18);
  }
  ctx.strokeStyle='#888';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H*0.15);ctx.stroke();
  ctx.fillStyle='#8B4513';
  ctx.fillRect(W/2-3,H*0.12,6,15);
  if(game.fish&&!game.fish.caught){
    ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(W/2,H*0.15);ctx.lineTo(game.fish.x,game.fish.y);ctx.stroke();
    drawFish(game.fish);
  }
  if(game.caughtAnim){
    const a=game.caughtAnim;
    ctx.save();
    ctx.globalAlpha=a.life;
    ctx.translate(a.x,a.y-(1-a.life)*80);
    ctx.font='bold 16px sans-serif';ctx.textAlign='center';
    ctx.fillStyle=a.judge==='PERFECT'?'#0ff':'#0f0';
    ctx.fillText(a.judge+' +'+Math.floor(a.type.score*(a.judge==='PERFECT'?2:1)),0,-30);
    ctx.fillStyle=a.type.color;ctx.font='bold 14px sans-serif';
    ctx.fillText(a.type.name,0,-10);
    ctx.restore();
  }
}
function loop(t){
  if(!game.running)return;
  const dt=Math.min((t-game.lastTime)/1000,.05)*60;
  game.lastTime=t;
  if(game.fish&&!game.fish.caught){
    game.fish.x+=game.fish.speed*game.fish.dir*dt;
    game.fish.wobble+=.1*dt;
    if(game.fish.x>W+60){game.fish.dir=-1;game.fish.y=H*0.3+Math.random()*H*0.5;}
    if(game.fish.x<-60){game.fish.dir=1;game.fish.y=H*0.3+Math.random()*H*0.5;}
  }
  if(Math.random()<.05*dt/16)game.bubbles.push({x:Math.random()*W,y:H+10,r:2+Math.random()*4,speed:.5+Math.random()});
  for(const b of game.bubbles)b.y-=b.speed*dt;
  game.bubbles=game.bubbles.filter(b=>b.y>-10);
  if(game.caughtAnim){game.caughtAnim.life-=.02*dt;if(game.caughtAnim.life<=0)game.caughtAnim=null;}
  draw();
  requestAnimationFrame(loop);
}
function startGame(){
  initAudio();resize();
  game.score=0;game.combo=0;game.maxCombo=0;game.missCount=0;game.bubbles=[];game.caughtAnim=null;
  scoreEl.textContent=0;comboEl.textContent=0;
  reelBtn.textContent='收線 (空白鍵)';reelBtn.classList.remove('caught');
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  game.running=true;game.lastTime=performance.now();
  spawnFish();
  requestAnimationFrame(loop);
}
function endGame(){
  game.running=false;
  if(game.score>best){best=game.score;try{localStorage.setItem('rhythmFishing_best',best)}catch(e){}}
  document.getElementById('best').textContent=best;
  document.getElementById('finalScore').textContent=game.score;
  document.getElementById('finalCombo').textContent=game.maxCombo;
  document.getElementById('finalBest').textContent=best;
  document.getElementById('endScreen').classList.remove('hidden');
}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('restartBtn').onclick=startGame;
reelBtn.addEventListener('pointerdown',e=>{e.preventDefault();reel();});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();reel();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.running)game.running=false;});
resize();draw();
</script>
</body>
