const I18N={
  zh:{title:'知識卡片翻轉',total:'共',cards:'張卡片',flipped:'已翻閱',shuffle:'重新洗牌',hint:'點擊翻轉'},
  en:{title:'Flashcards',total:'Total',cards:'cards',flipped:'flipped',shuffle:'Shuffle',hint:'Click to flip'}
};
let lang='zh',flippedSet=new Set(),cards=[];
function t(k){return I18N[lang][k]||k}
function toggleLang(){lang=lang==='zh'?'en':'zh';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelector('.lang-btn').textContent=lang==='zh'?'EN':'中';renderCards()}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function renderCards(){
  flippedSet.clear();
  document.getElementById('flippedCount').textContent='0';
  cards=shuffle([...SITE_CONFIG.flashcards]);
  document.getElementById('totalCards').textContent=cards.length;
  const grid=document.getElementById('cardsGrid');grid.innerHTML='';
  cards.forEach((c,i)=>{
    const div=document.createElement('div');div.className='flip-card';
    div.innerHTML='<div class="flip-inner"><div class="flip-face flip-front"><span class="card-num">'+(i+1)+'</span><i class="fas '+(c.icon||'fa-lightbulb')+'"></i><div class="card-title">'+(lang==='zh'?c.front:c.frontEn)+'</div><span class="hint"><i class="fas fa-sync-alt"></i> '+t('hint')+'</span></div><div class="flip-face flip-back"><span class="tag">'+(lang==='zh'?'答案':'Answer')+'</span><div class="answer">'+(lang==='zh'?c.back:c.backEn)+'</div></div></div>';
    div.onclick=()=>{
      div.classList.toggle('flipped');
      if(div.classList.contains('flipped')){flippedSet.add(i)}else{flippedSet.delete(i)}
      document.getElementById('flippedCount').textContent=flippedSet.size;
    };
    grid.appendChild(div);
  });
}
function shuffleCards(){
  const grid=document.getElementById('cardsGrid');
  grid.classList.add('shuffle-anim');
  setTimeout(()=>{grid.classList.remove('shuffle-anim');renderCards()},400);
}
renderCards();
