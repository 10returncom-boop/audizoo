<body>
<div id="game">
  <div id="hud">
    <span>分數：<span id="score">0</span></span>
    <span>連擊：<span id="combo">0</span></span>
    <span>最高：<span id="best">0</span></span>
  </div>
  <div id="lyrics">準備開始</div>
  <div id="pitch-area">
    <canvas id="pitch-canvas"></canvas>
    <div id="target-indicator"></div>
  </div>
  <div id="status">點選開始，允許麥克風後唱歌</div>
  <div id="controls">
    <button class="btn btn-primary" id="startBtn">開始演唱</button>
  </div>
  <div id="startScreen" class="overlay">
    <h1>卡拉OK評分</h1>
    <p>對著麥克風唱出顯示的音符！<br>畫面上會顯示目標音高區域<br>你的聲音越接近目標音高，分數越高<br>需要允許麥克風許可權才能遊玩<br>（也可以用哼聲或彈奏樂器）</p>
    <button id="overlayStart">開始遊戲</button>
  </div>
  <div id="endScreen" class="overlay hidden">
    <h2>演唱結束</h2>
    <div class="stats">
      本局分數：<b id="finalScore">0</b><br>
      最高連擊：<b id="finalCombo">0</b><br>
      歷史最高：<b id="finalBest">0</b><br>
      評價：<b id="rank">C</b>
    </div>
    <button id="restartBtn">再唱一首</button>
  </div>
</div>
<script>
const AC=window.AudioContext||window.webkitAudioContext;
let audioCtx=null,analyser=null,micStream=null,micSource=null;
const cv=document.getElementById('pitch-canvas');
const ctx=cv.getContext('2d');
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTE_FREQS=[];
for(let i=0;i<60;i++)NOTE_FREQS.push(440*Math.pow(2,(i-33)/12));
const SONG=[
  {note:43,dur:1,lyric:'小'},{note:43,dur:1,lyric:'星'},{note:45,dur:1,lyric:'星'},{note:47,dur:1,lyric:'閃'},
  {note:48,dur:2,lyric:'亮'},{note:47,dur:1,lyric:'天'},{note:45,dur:1,lyric:'空'},{note:43,dur:2,lyric:'中'},
  {note:40,dur:1,lyric:'好'},{note:40,dur:1,lyric:'像'},{note:43,dur:1,lyric:'有'},{note:45,dur:1,lyric:'隻'},
  {note:47,dur:2,lyric:'小'},{note:45,dur:1,lyric:'船'},{note:43,dur:3,lyric:'兒'},
];
const game={score:0,combo:0,maxCombo:0,running:false,songIdx:0,noteTime:0,currentPitch:0,pitchHistory:[],lastTime:0};
const scoreEl=document.getElementById('score');
const comboEl=document.getElementById('combo');
const lyricsEl=document.getElementById('lyrics');
const statusEl=document.getElementById('status');
let best=0;
try{best=parseInt(localStorage.getItem('karaoke_best')||'0')}catch(e){}
document.getElementById('best').textContent=best;

function resize(){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);}
window.addEventListener('resize',resize);

async function initMic(){
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false}});
    if(!audioCtx)audioCtx=new AC();
    micSource=audioCtx.createMediaStreamSource(micStream);
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=2048;
    micSource.connect(analyser);
    return true;
  }catch(e){
    statusEl.textContent='無法存取麥克風，請檢查權限';
    return false;
  }
}

function detectPitch(){
  if(!analyser)return 0;
  const buf=new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  let rms=0;
  for(let i=0;i<buf.length;i++)rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/buf.length);
  if(rms<.01)return 0;
  let r1=0,r2=0,r3=0;
  const N=buf.length;
  for(let i=0;i<N;i++){
    r1+=buf[i]*buf[i];
    if(i<N-1)r2+=buf[i]*buf[i+1];
    if(i<N-2)r3+=buf[i]*buf[i+2];
  }
  const threshold=.95*r1;
  if(r2>threshold&&r3>threshold)return 0;
  let minLag=0,maxLag=N-1;
  for(let i=1;i<N-1;i++){
    if(buf[i]<buf[i-1]&&buf[i]<buf[i+1]){if(minLag===0)minLag=i;maxLag=i;}
  }
  if(maxLag-minLag<10)return 0;
  let bestCorr=0,bestLag=0;
  for(let lag=minLag;lag<=maxLag;lag++){
    let corr=0;
    for(let i=0;i<N-lag;i++)corr+=buf[i]*buf[i+lag];
    if(corr>bestCorr){bestCorr=corr;bestLag=lag;}
  }
  if(bestLag===0||bestCorr<.3*r1)return 0;
  return audioCtx.sampleRate/bestLag;
}

function freqToNoteIdx(freq){
  if(freq<=0)return -1;
  return Math.round(12*Math.log2(freq/440)+69)-12;
}

function draw(){
  const W=cv.clientWidth,H=cv.clientHeight;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0d0d2b';ctx.fillRect(0,0,W,H);
  const minNote=36,maxNote=60;
  const noteH=H/(maxNote-minNote);
  for(let i=0;i<maxNote-minNote;i++){
    const n=minNote+i;
    if(n%12===0||n%12===7){ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(0,H-(i+1)*noteH,W,noteH);}
  }
  if(game.running&&game.songIdx<SONG.length){
    const target=SONG[game.songIdx].note;
    const y=H-(target-minNote)*noteH;
    ctx.fillStyle='rgba(0,255,255,.2)';
    ctx.fillRect(0,y-noteH/2,W,noteH);
    ctx.strokeStyle='#0ff';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
  if(game.pitchHistory.length>1){
    ctx.strokeStyle='#f0f';ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<game.pitchHistory.length;i++){
      const p=game.pitchHistory[i];
      if(p<=0)continue;
      const idx=freqToNoteIdx(p);
      const x=(i/game.pitchHistory.length)*W;
      const y=H-(idx-minNote)*noteH;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  if(game.currentPitch>0){
    const idx=freqToNoteIdx(game.currentPitch);
    const y=H-(idx-minNote)*noteH;
    ctx.fillStyle='#ff0';ctx.shadowColor='#ff0';ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(W-20,y,6,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }
  const names=[];
  for(let i=minNote;i<=maxNote;i+=2)names.push({note:i,name:NOTE_NAMES[i%12]+(Math.floor(i/12)-1)});
  ctx.fillStyle='#666';ctx.font='10px sans-serif';ctx.textAlign='right';
  names.forEach(n=>{ctx.fillText(n.name,W-5,H-(n.note-minNote)*noteH+3);});
}

function loop(t){
  if(!game.running)return;
  const dt=Math.min((t-game.lastTime)/1000,.1);
  game.lastTime=t;
  game.currentPitch=detectPitch();
  game.pitchHistory.push(game.currentPitch);
  if(game.pitchHistory.length>100)game.pitchHistory.shift();
  if(game.songIdx<SONG.length){
    game.noteTime+=dt;
    const target=SONG[game.songIdx];
    lyricsEl.textContent=target.lyric;
    if(game.currentPitch>0){
      const playerNote=freqToNoteIdx(game.currentPitch);
      const diff=Math.abs(playerNote-target.note);
      if(diff<=1){
        game.score+=Math.round((2-diff)*10*dt*10);
        game.combo++;
        game.maxCombo=Math.max(game.maxCombo,game.combo);
        statusEl.textContent=diff===0?'完美！':'很好！';
        statusEl.style.color=diff===0?'#0ff':'#0f0';
      }else{
        game.combo=0;
        statusEl.textContent='繼續加油';
        statusEl.style.color='#888';
      }
    }else{
      game.combo=0;
      statusEl.textContent='請發出聲音';
      statusEl.style.color='#888';
    }
    scoreEl.textContent=game.score;
    comboEl.textContent=game.combo;
    if(game.noteTime>=target.dur*.8){
      game.noteTime=0;
      game.songIdx++;
      game.pitchHistory=[];
    }
  }else{
    endGame();
    return;
  }
  draw();
  requestAnimationFrame(loop);
}

async function startGame(){
  if(!await initMic())return;
  if(audioCtx.state==='suspended')await audioCtx.resume();
  game.score=0;game.combo=0;game.maxCombo=0;game.songIdx=0;game.noteTime=0;game.pitchHistory=[];game.currentPitch=0;
  scoreEl.textContent=0;comboEl.textContent=0;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  resize();
  game.running=true;game.lastTime=performance.now();
  requestAnimationFrame(loop);
}

function endGame(){
  game.running=false;
  if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}
  if(game.score>best){best=game.score;try{localStorage.setItem('karaoke_best',best)}catch(e){}}
  document.getElementById('best').textContent=best;
  document.getElementById('finalScore').textContent=game.score;
  document.getElementById('finalCombo').textContent=game.maxCombo;
  document.getElementById('finalBest').textContent=best;
  let rank='C';
  if(game.score>3000)rank='S';
  else if(game.score>2000)rank='A';
  else if(game.score>1000)rank='B';
  document.getElementById('rank').textContent=rank;
  document.getElementById('endScreen').classList.remove('hidden');
}

document.getElementById('startBtn').onclick=startGame;
document.getElementById('overlayStart').onclick=startGame;
document.getElementById('restartBtn').onclick=startGame;
resize();
draw();
</script>
