<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;user-select:none;touch-action:none}
#game{position:relative;width:100%;max-width:500px;height:100%;display:flex;flex-direction:column;padding:10px;gap:10px}
#hud{display:flex;justify-content:space-between;font-size:16px}
#notes-count{color:#0ff;font-weight:bold}
#best{color:#f80;font-weight:bold}
canvas{flex:1;background:#0d0d2b;border:2px solid #333;border-radius:8px;display:block;cursor:crosshair}
#controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{padding:10px 20px;font-size:15px;font-weight:bold;border:none;border-radius:20px;cursor:pointer;transition:all .1s}
.btn-primary{background:linear-gradient(90deg,#0ff,#f0f);color:#000}
.btn-secondary{background:#333;color:#fff;border:2px solid #555}
.btn-danger{background:#533;color:#f88;border:2px solid #844}
.btn:active{transform:scale(.95)}
#status{text-align:center;font-size:14px;color:#888;min-height:20px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:20px;padding:20px}
.overlay h1{font-size:34px;background:linear-gradient(90deg,#0ff,#f0f);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.overlay p{font-size:15px;color:#aaa;text-align:center;line-height:1.8;max-width:350px}
.overlay button{padding:14px 40px;font-size:20px;font-weight:bold;border:none;border-radius:30px;background:linear-gradient(90deg,#0ff,#f0f);color:#000;cursor:pointer}
.hidden{display:none!important}

  });

<body>
<div id="game">
  <div id="hud">
    <span>音符數：<span id="notes-count">0</span></span>
    <span>最高創作：<span id="best">0</span></span>
  </div>
  <canvas id="cv"></canvas>
  <div id="controls">
    <button class="btn btn-primary" id="playBtn">播放旋律</button>
    <button class="btn btn-secondary" id="clearBtn">清除畫布</button>
    <button class="btn btn-danger" id="undoBtn">復原</button>
  </div>
  <div id="status">在畫布上繪製旋律，橫軸為時間，縱軸為音高</div>
  <div id="startScreen" class="overlay">
    <h1>音樂畫布</h1>
    <p>用手指或滑鼠在畫布上畫出旋律！<br>橫軸代表時間，縱軸代表音高<br>畫得越高，音調越高<br>畫完後點選「播放旋律」欣賞你的創作<br>也可以一邊畫一邊聽到即時音效！</p>
    <button id="overlayStart">開始創作</button>
  </div>
</div>
<script>
const AC=window.AudioContext||window.webkitAudioContext;
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume()}
function playNote(freq,dur=.2,type='sine',vol=.2){
  if(!audioCtx||freq<=0)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
}
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const game={strokes:[],currentStroke:[],drawing:false,playing:false,history:[]};
const countEl=document.getElementById('notes-count');
let best=0;
try{best=parseInt(localStorage.getItem('musicCanvas_best')||'0')}catch(e){}
document.getElementById('best').textContent=best;

function resize(){
  const rect=cv.getBoundingClientRect();
  cv.width=rect.width*devicePixelRatio;
  cv.height=rect.height*devicePixelRatio;
  ctx.scale(devicePixelRatio,devicePixelRatio);
  draw();
}
window.addEventListener('resize',resize);

function yToFreq(y,H){
  const minFreq=130.81,maxFreq=1046.5;
  const ratio=1-y/H;
  return minFreq*Math.pow(maxFreq/minFreq,ratio);
}
function freqToNoteName(freq){
  const idx=Math.round(12*Math.log2(freq/440)+69);
  return NOTE_NAMES[idx%12]+(Math.floor(idx/12)-1);
}

function draw(){
  const W=cv.clientWidth,H=cv.clientHeight;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0d0d2b';ctx.fillRect(0,0,W,H);
  const octaves=5;
  for(let i=0;i<=octaves*12;i++){
    const y=H-(i/(octaves*12))*H;
    const note=i%12;
    if(note===0||note===7){ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(0,y-1,W,2);}
    if(note===0){ctx.fillStyle='rgba(0,255,255,.3)';ctx.font='10px sans-serif';ctx.textAlign='left';ctx.fillText('C'+(Math.floor(i/12)+2),5,y-3);}
  }
  const allStrokes=[...game.strokes,game.currentStroke];
  for(const stroke of allStrokes){
    if(stroke.length<2)continue;
    ctx.strokeStyle='#f0f';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.shadowColor='#f0f';ctx.shadowBlur=8;
    ctx.beginPath();
    ctx.moveTo(stroke[0].x,stroke[0].y);
    for(let i=1;i<stroke.length;i++)ctx.lineTo(stroke[i].x,stroke[i].y);
    ctx.stroke();
    ctx.shadowBlur=0;
  }
  if(game.currentStroke.length>0){
    const p=game.currentStroke[game.currentStroke.length-1];
    const freq=yToFreq(p.y,H);
    ctx.fillStyle='#ff0';ctx.shadowColor='#ff0';ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#ff0';ctx.font='bold 12px sans-serif';ctx.textAlign='left';
    ctx.fillText(freqToNoteName(freq),p.x+10,p.y-5);
  }
}

function getPos(e){
  const rect=cv.getBoundingClientRect();
  const x=(e.clientX||e.touches[0].clientX)-rect.left;
  const y=(e.clientY||e.touches[0].clientY)-rect.top;
  return{x:Math.max(0,Math.min(cv.clientWidth,x)),y:Math.max(0,Math.min(cv.clientHeight,y))};
}

function startDraw(e){
  if(game.playing)return;
  e.preventDefault();
  initAudio();
  game.drawing=true;
  game.currentStroke=[getPos(e)];
  game.history.push(game.strokes.map(s=>[...s]));
  if(game.history.length>20)game.history.shift();
}
function moveDraw(e){
  if(!game.drawing||game.playing)return;
  e.preventDefault();
  const pos=getPos(e);
  const last=game.currentStroke[game.currentStroke.length-1];
  if(Math.abs(pos.x-last.x)>2||Math.abs(pos.y-last.y)>2){
    game.currentStroke.push(pos);
    const freq=yToFreq(pos.y,cv.clientHeight);
    playNote(freq,.08,'sine',.1);
    countEl.textContent=game.strokes.reduce((a,s)=>a+s.length,0)+game.currentStroke.length;
  }
  draw();
}
function endDraw(e){
  if(!game.drawing)return;
  game.drawing=false;
  if(game.currentStroke.length>1){
    game.strokes.push([...game.currentStroke]);
  }
  game.currentStroke=[];
  const total=game.strokes.reduce((a,s)=>a+s.length,0);
  countEl.textContent=total;
  if(total>best){best=total;try{localStorage.setItem('musicCanvas_best',best)}catch(e){}document.getElementById('best').textContent=best;}
  draw();
}

async function playMelody(){
  if(game.playing||game.strokes.length===0)return;
  initAudio();
  game.playing=true;
  document.getElementById('playBtn').textContent='播放中...';
  const W=cv.clientWidth,H=cv.clientHeight;
  const allPoints=[];
  for(const stroke of game.strokes)for(const p of stroke)allPoints.push(p);
  allPoints.sort((a,b)=>a.x-b.x);
  if(allPoints.length===0){game.playing=false;document.getElementById('playBtn').textContent='播放旋律';return;}
  const duration=Math.max(2,allPoints.length*0.05);
  const startTime=audioCtx.currentTime;
  for(let i=0;i<allPoints.length;i++){
    const p=allPoints[i];
    const t=startTime+(p.x/W)*duration;
    const freq=yToFreq(p.y,H);
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine';o.frequency.value=freq;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.15,t+.02);
    g.gain.linearRampToValueAtTime(.15,t+.08);
    g.gain.exponentialRampToValueAtTime(.001,t+.15);
    o.connect(g);g.connect(audioCtx.destination);
    o.start(t);o.stop(t+.15);
  }
  const playPos={x:0};
  const animStart=performance.now();
  function anim(){
    const elapsed=(performance.now()-animStart)/1000;
    playPos.x=(elapsed/duration)*W;
    draw();
    ctx.strokeStyle='#ff0';ctx.lineWidth=2;ctx.setLineDash([5,5]);
    ctx.beginPath();ctx.moveTo(playPos.x,0);ctx.lineTo(playPos.x,H);ctx.stroke();
    ctx.setLineDash([]);
    if(elapsed<duration+.3)requestAnimationFrame(anim);
    else{game.playing=false;document.getElementById('playBtn').textContent='播放旋律';draw();}
  }
  anim();
}

cv.addEventListener('pointerdown',startDraw);
cv.addEventListener('pointermove',moveDraw);
cv.addEventListener('pointerup',endDraw);
cv.addEventListener('pointerleave',endDraw);

document.getElementById('playBtn').onclick=playMelody;
document.getElementById('clearBtn').onclick=()=>{
  game.history.push(game.strokes.map(s=>[...s]));
  game.strokes=[];game.currentStroke=[];
  countEl.textContent=0;draw();
};
document.getElementById('undoBtn').onclick=()=>{
  if(game.history.length>0){
    game.strokes=game.history.pop();
    countEl.textContent=game.strokes.reduce((a,s)=>a+s.length,0);
    draw();
  }
};
document.getElementById('overlayStart').onclick=()=>{
  document.getElementById('startScreen').classList.add('hidden');
  initAudio();
};
resize();
draw();
</script>
</body>
