#game{position:relative;width:100%;max-width:500px;height:100%;display:flex;flex-direction:column}

.ctrl.move{background:rgba(0,255,255,.1);border-color:#0ff;color:#0ff}

.overlay h1{font-size:34px;background:linear-gradient(90deg,#0ff,#f0f);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.overlay p{font-size:15px;color:#aaa;text-align:center;line-height:1.8;max-width:350px}
.overlay button{padding:14px 40px;font-size:20px;font-weight:bold;border:none;border-radius:30px;background:linear-gradient(90deg,#0ff,#f0f);color:#000;cursor:pointer}
.overlay .stats{font-size:18px;line-height:2;text-align:center}
.overlay .stats b{color:#0ff}
.hidden{display:none!important}

<body>
<div id="game">
  <div id="hud">
    <span>分數：<span id="score">0</span></span>
    <span>連擊：<span id="combo">0</span></span>
    <span>最高：<span id="best">0</span></span>
  </div>
  <canvas id="cv"></canvas>
  <div id="beat-indicator">節奏</div>
  <div id="controls">
    <button class="ctrl move" id="btnLeft">← 左</button>
    <button class="ctrl shoot" id="btnShoot">射擊 (空白)</button>
    <button class="ctrl move" id="btnRight">右 →</button>
  </div>
  <div id="startScreen" class="overlay">
    <h1>節奏太空射擊</h1>
    <p>在太空中和節奏共鳴！<br>跟著背景音樂的節拍射擊，在節拍點射擊威力加倍<br>移動飛船躲避隕石，射擊消滅敵人<br>鍵盤 ← → 移動，空白鍵射擊<br>在節拍指示器發光時射擊得分更高！</p>
    <button id="startBtn">開始遊戲</button>
  </div>
  <div id="endScreen" class="overlay hidden">
    <h2>遊戲結束</h2>
    <div class="stats">
      本局分數：<b id="finalScore">0</b><br>
      最高連擊：<b id="finalCombo">0</b><br>
      歷史最高：<b id="finalBest">0</b>
    </div>
    <button id="restartBtn">再來一局</button>
  </div>
</div>
<script>
const AC=window.AudioContext||window.webkitAudioContext;
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume()}
function playShoot(onBeat){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='square';
  o.frequency.setValueAtTime(onBeat?880:440,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(onBeat?220:110,audioCtx.currentTime+.1);
  g.gain.setValueAtTime(onBeat?.2:.12,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.12);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.12);
}
function playExplosion(){
  if(!audioCtx)return;
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*.3,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/2000);
  const src=audioCtx.createBufferSource(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();
  f.type='lowpass';f.frequency.value=1000;
  src.buffer=buf;src.connect(f);f.connect(g);g.connect(audioCtx.destination);
  g.gain.setValueAtTime(.25,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.3);
  src.start();
}
function playBeat(){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.frequency.setValueAtTime(80,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(30,audioCtx.currentTime+.08);
  g.gain.setValueAtTime(.15,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.1);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.1);
}
const cv=document.getElementById('cv');const ctx=cv.getContext('2d');
let W,H;
function resize(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);}
window.addEventListener('resize',resize);
const game={score:0,combo:0,maxCombo:0,running:false,player:{x:0,y:0,w:40,h:30},bullets:[],enemies:[],particles:[],stars:[],beatPhase:0,bpm:120,lastTime:0,moveDir:0,shootCooldown:0,spawnTimer:0};
const scoreEl=document.getElementById('score');
const comboEl=document.getElementById('combo');
const beatInd=document.getElementById('beat-indicator');
let best=0;
try{best=parseInt(localStorage.getItem('rhythmSpace_best')||'0')}catch(e){}
document.getElementById('best').textContent=best;

function initStars(){
  game.stars=[];
  for(let i=0;i<80;i++)game.stars.push({x:Math.random()*W,y:Math.random()*H,speed:.5+Math.random()*2,size:Math.random()*2});
}
function spawnEnemy(){
  const type=Math.random()<.7?'asteroid':'ufo';
  game.enemies.push({
    x:Math.random()*(W-40)+20,y:-40,
    w:type==='asteroid'?30:35,h:type==='asteroid'?30:25,
    speed:1+Math.random()*1.5+game.score/5000,
    type,hp:type==='asteroid'?1:2,
    wobble:Math.random()*Math.PI*2
  });
}
function shoot(){
  if(!game.running||game.shootCooldown>0)return;
  initAudio();
  game.shootCooldown=.15;
  const phase=game.beatPhase%1;
  const onBeat=Math.min(phase,1-phase)<.12;
  playShoot(onBeat);
  if(onBeat){
    game.combo++;game.maxCombo=Math.max(game.maxCombo,game.combo);
    beatInd.classList.add('beat');setTimeout(()=>beatInd.classList.remove('beat'),150);
  }else{game.combo=0;}
  game.bullets.push({x:game.player.x,y:game.player.y-15,speed:8,damage:onBeat?3:1,onBeat});
  comboEl.textContent=game.combo;
}
function addParticles(x,y,color,count=10){
  for(let i=0;i<count;i++){
    game.particles.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:1,color});
  }
}
function loop(t){
  if(!game.running)return;
  const dt=Math.min((t-game.lastTime)/1000,.05)*60;
  game.lastTime=t;
  game.beatPhase+=(game.bpm/60)*dt/60;
  const phase=game.beatPhase%1;
  if(phase<.03&&Math.floor(game.beatPhase)!==Math.floor(game.beatPhase-(game.bpm/60)*dt/60)){
    playBeat();
    beatInd.classList.add('beat');setTimeout(()=>beatInd.classList.remove('beat'),100);
  }
  game.shootCooldown-=dt/60;
  game.player.x+=game.moveDir*5*dt;
  game.player.x=Math.max(20,Math.min(W-20,game.player.x));
  game.spawnTimer+=dt;
  if(game.spawnTimer>50-game.score/500){game.spawnTimer=0;spawnEnemy();}
  for(let i=game.bullets.length-1;i>=0;i--){
    const b=game.bullets[i];
    b.y-=b.speed*dt;
    if(b.y<-10){game.bullets.splice(i,1);continue;}
    for(let j=game.enemies.length-1;j>=0;j--){
      const e=game.enemies[j];
      if(b.x>e.x-e.w/2&&b.x<e.x+e.w/2&&b.y>e.y-e.h/2&&b.y<e.y+e.h/2){
        e.hp-=b.damage;
        game.bullets.splice(i,1);
        addParticles(b.x,b.y,b.onBeat?'#0ff':'#888',5);
        if(e.hp<=0){
          game.enemies.splice(j,1);
          game.score+=e.type==='ufo'?50:20;
          if(b.onBeat)game.score*=1;
          playExplosion();
          addParticles(e.x,e.y,e.type==='ufo'?'#f0f':'#fa0',15);
        }
        scoreEl.textContent=game.score;
        break;
      }
    }
  }
  for(let i=game.enemies.length-1;i>=0;i--){
    const e=game.enemies[i];
    e.y+=e.speed*dt;
    e.wobble+=.05*dt;
    e.x+=Math.sin(e.wobble)*.5*dt;
    if(e.y>H+40){game.enemies.splice(i,1);continue;}
    if(Math.abs(e.x-game.player.x)<30&&Math.abs(e.y-game.player.y)<25){
      playExplosion();addParticles(game.player.x,game.player.y,'#0ff',20);
      endGame();return;
    }
  }
  for(const s of game.stars){s.y+=s.speed*dt;if(s.y>H){s.y=0;s.x=Math.random()*W;}}
  for(const p of game.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=.03*dt;}
  game.particles=game.particles.filter(p=>p.life>0);
  draw();
  requestAnimationFrame(loop);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  for(const s of game.stars){ctx.fillStyle=`rgba(255,255,255,${.3+s.speed/3})`;ctx.fillRect(s.x,s.y,s.size,s.size);}
  for(const e of game.enemies){
    ctx.save();ctx.translate(e.x,e.y);
    if(e.type==='asteroid'){
      ctx.fillStyle='#888';ctx.shadowColor='#888';ctx.shadowBlur=8;
      ctx.beginPath();
      for(let i=0;i<8;i++){
        const a=i/8*Math.PI*2,r=e.w/2*(.8+Math.sin(i*3+e.wobble)*.2);
        if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);
        else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
      }
      ctx.closePath();ctx.fill();
    }else{
      ctx.fillStyle='#f0f';ctx.shadowColor='#f0f';ctx.shadowBlur=12;
      ctx.beginPath();ctx.ellipse(0,0,e.w/2,e.h/3,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#0ff';ctx.beginPath();ctx.ellipse(0,-5,e.w/4,e.h/4,0,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
  for(const b of game.bullets){
    ctx.fillStyle=b.onBeat?'#0ff':'#888';ctx.shadowColor=b.onBeat?'#0ff':'#888';ctx.shadowBlur=10;
    ctx.fillRect(b.x-2,b.y-8,4,16);
  }
  ctx.shadowBlur=0;
  for(const p of game.particles){
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(game.player.x,game.player.y);
  ctx.fillStyle='#0ff';ctx.shadowColor='#0ff';ctx.shadowBlur=15;
  ctx.beginPath();
  ctx.moveTo(0,-15);ctx.lineTo(-18,12);ctx.lineTo(-8,8);ctx.lineTo(0,12);ctx.lineTo(8,8);ctx.lineTo(18,12);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#ff0';ctx.shadowColor='#ff0';
  ctx.beginPath();ctx.moveTo(-5,12);ctx.lineTo(0,20+Math.random()*5);ctx.lineTo(5,12);ctx.closePath();ctx.fill();
  ctx.restore();
}
function startGame(){
  initAudio();resize();
  game.score=0;game.combo=0;game.maxCombo=0;game.bullets=[];game.enemies=[];game.particles=[];
  game.beatPhase=0;game.moveDir=0;game.shootCooldown=0;game.spawnTimer=0;
  game.player={x:W/2,y:H-80,w:40,h:30};
  initStars();
  scoreEl.textContent=0;comboEl.textContent=0;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  game.running=true;game.lastTime=performance.now();
  requestAnimationFrame(loop);
}
function endGame(){
  game.running=false;
  if(game.score>best){best=game.score;try{localStorage.setItem('rhythmSpace_best',best)}catch(e){}}
  document.getElementById('best').textContent=best;
  document.getElementById('finalScore').textContent=game.score;
  document.getElementById('finalCombo').textContent=game.maxCombo;
  document.getElementById('finalBest').textContent=best;
  document.getElementById('endScreen').classList.remove('hidden');
}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('restartBtn').onclick=startGame;
document.getElementById('btnShoot').addEventListener('pointerdown',e=>{e.preventDefault();shoot();});
document.getElementById('btnLeft').addEventListener('pointerdown',e=>{e.preventDefault();game.moveDir=-1;});
document.getElementById('btnLeft').addEventListener('pointerup',()=>game.moveDir=0);
document.getElementById('btnLeft').addEventListener('pointerleave',()=>game.moveDir=0);
document.getElementById('btnRight').addEventListener('pointerdown',e=>{e.preventDefault();game.moveDir=1;});
document.getElementById('btnRight').addEventListener('pointerup',()=>game.moveDir=0);
document.getElementById('btnRight').addEventListener('pointerleave',()=>game.moveDir=0);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')game.moveDir=-1;
  if(e.key==='ArrowRight')game.moveDir=1;
  if(e.code==='Space'){e.preventDefault();shoot();}
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'&&game.moveDir===-1)game.moveDir=0;
  if(e.key==='ArrowRight'&&game.moveDir===1)game.moveDir=0;
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.running)game.running=false;});
resize();draw();
</script>
