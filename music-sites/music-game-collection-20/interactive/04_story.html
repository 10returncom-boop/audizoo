const I18N={
  zh:{title:'滾動敘事',scroll:'向下滾動繼續'},
  en:{title:'Scroll Story',scroll:'Scroll down to continue'}
};
let lang='zh';
function t(k){return I18N[lang][k]||k}
function toggleLang(){lang=lang==='zh'?'en':'zh';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelector('.lang-btn').textContent=lang==='zh'?'EN':'中';renderChapters()}
function renderChapters(){
  const container=document.getElementById('chapters');container.innerHTML='';
  SITE_CONFIG.storyChapters.forEach((ch,i)=>{
    const div=document.createElement('section');
    div.className='chapter ch'+((i%6)+1);
    const isLast=i===SITE_CONFIG.storyChapters.length-1;
    div.innerHTML='<div class="chapter-content"><div class="chapter-num">'+String(i+1).padStart(2,'0')+'</div><div class="chapter-icon"><i class="fas '+(ch.icon||'fa-star')+'"></i></div><h2>'+(lang==='zh'?ch.title:ch.titleEn)+'</h2><div class="divider"></div><p>'+(lang==='zh'?ch.content:ch.contentEn)+'</p></div>'+(isLast?'':'<div class="scroll-hint"><i class="fas fa-chevron-down"></i> '+t('scroll')+'</div>');
    container.appendChild(div);
  });
  observeChapters();
}
function observeChapters(){
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')});
  },{threshold:0.25});
  document.querySelectorAll('.chapter').forEach(c=>obs.observe(c));
}
window.addEventListener('scroll',()=>{
  const h=document.documentElement;
  const pct=(h.scrollTop)/(h.scrollHeight-h.clientHeight)*100;
  document.getElementById('progressFill').style.width=pct+'%';
});
renderChapters();
</script>
