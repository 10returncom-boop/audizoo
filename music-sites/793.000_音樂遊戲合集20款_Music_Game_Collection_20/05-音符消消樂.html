<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a0a2e;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;user-select:none;touch-action:none}
#game{position:relative;width:100%;max-width:450px;height:100%;display:flex;flex-direction:column;padding:10px;gap:10px}
#hud{display:flex;justify-content:space-between;font-size:16px}
#score{color:#ff0;font-weight:bold}
#moves{color:#0ff;font-weight:bold}
#best{color:#f80;font-weight:bold}
#board{flex:1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(7,1fr);gap:4px;background:rgba(0,0,0,.3);padding:8px;border-radius:12px}
.cell{display:flex;align-items:center;justify-content:center;font-size:28px;border-radius:8px;cursor:pointer;transition:transform .15s,background .15s;user-select:none}
.cell:hover{transform:scale(1.08)}
.cell.selected{transform:scale(1.15);box-shadow:0 0 15px currentColor}
.cell.matched{animation:pop .3s forwards}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(0);opacity:0}}
.cell.t0{background:rgba(255,68,102,.2);color:#ff4466}
.cell.t1{background:rgba(68,255,102,.2);color:#44ff66}
.cell.t2{background:rgba(68,136,255,.2);color:#4488ff}
.cell.t3{background:rgba(255,170,68,.2);color:#ffaa44}
.cell.t4{background:rgba(204,102,255,.2);color:#cc66ff}
.cell.t5{background:rgba(0,255,255,.2);color:#00ffff}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:20px;padding:20px}
.overlay h1{font-size:36px;background:linear-gradient(90deg,#ff0,#f0f);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.overlay p{font-size:15px;color:#aaa;text-align:center;line-height:1.8}
.overlay button{padding:14px 40px;font-size:20px;font-weight:bold;border:none;border-radius:30px;background:linear-gradient(90deg,#ff0,#f0f);color:#000;cursor:pointer}
.overlay .stats{font-size:18px;line-height:2;text-align:center}
.overlay .stats b{color:#ff0}
.hidden{display:none!important}
</style>

<body>
<div id="game">
  <div id="hud">
    <span>分數：<span id="score">0</span></span>
    <span>步數：<span id="moves">30</span></span>
    <span>最高：<span id="best">0</span></span>
  </div>
  <div id="board"></div>
  <div id="startScreen" class="overlay">
    <h1>音符消消樂</h1>
    <p>交換相鄰音符，使三個或更多相同音符連成一線<br>每次消除都會彈出美妙的音樂！<br>在 30 步內獲得最高分</p>
    <button id="startBtn">開始遊戲</button>
  </div>
  <div id="endScreen" class="overlay hidden">
    <h2>遊戲結束</h2>
    <div class="stats">
      本局分數：<b id="finalScore">0</b><br>
      歷史最高：<b id="finalBest">0</b>
    </div>
    <button id="restartBtn">再來一局</button>
  </div>
</div>
<script>
const AC=window.AudioContext||window.webkitAudioContext;
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume()}
function playChord(notes,dur=.3){
  if(!audioCtx)return;
  notes.forEach((f,i)=>{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(.15,audioCtx.currentTime+i*.05);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur+i*.05);
    o.connect(g);g.connect(audioCtx.destination);
    o.start(audioCtx.currentTime+i*.05);o.stop(audioCtx.currentTime+dur+i*.05);
  });
}
const NOTE_FREQS=[261.63,293.66,329.63,349.23,392,440];
const NOTE_SYMBOLS=['♪','♫','♬','♩','♭','♯'];
const ROWS=7,COLS=6;
const game={grid:[],selected:null,score:0,moves:30,running:false,animating:false};
const board=document.getElementById('board');
const scoreEl=document.getElementById('score');
const movesEl=document.getElementById('moves');
let best=0;
try{best=parseInt(localStorage.getItem('noteMatch_best')||'0')}catch(e){}
document.getElementById('best').textContent=best;

function makeCell(type){
  const el=document.createElement('div');
  el.className='cell t'+type;
  el.textContent=NOTE_SYMBOLS[type];
  return el;
}
function initGrid(){
  game.grid=[];
  for(let r=0;r<ROWS;r++){
    game.grid[r]=[];
    for(let c=0;c<COLS;c++){
      let type;
      do{type=Math.floor(Math.random()*6);}
      while((c>=2&&game.grid[r][c-1]===type&&game.grid[r][c-2]===type)||
            (r>=2&&game.grid[r-1][c]===type&&game.grid[r-2][c]===type));
      game.grid[r][c]=type;
    }
  }
}
function render(){
  board.innerHTML='';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const el=makeCell(game.grid[r][c]);
    el.dataset.r=r;el.dataset.c=c;
    if(game.selected&&game.selected.r===r&&game.selected.c===c)el.classList.add('selected');
    el.addEventListener('click',()=>onCellClick(r,c));
    board.appendChild(el);
  }
}
function onCellClick(r,c){
  if(!game.running||game.animating)return;
  initAudio();
  if(!game.selected){game.selected={r,c};render();return;}
  const s=game.selected;
  if(s.r===r&&s.c===c){game.selected=null;render();return;}
  if(Math.abs(s.r-r)+Math.abs(s.c-c)===1){
    swap(s.r,s.c,r,c);
    game.selected=null;
    game.moves--;movesEl.textContent=game.moves;
    setTimeout(()=>{
      const matches=findMatches();
      if(matches.length>0){
        game.animating=true;
        processMatches(matches);
      }else{
        swap(s.r,s.c,r,c);
        game.moves++;movesEl.textContent=game.moves;
        render();
      }
      if(game.moves<=0)setTimeout(endGame,500);
    },150);
    render();
  }else{
    game.selected={r,c};render();
  }
}
function swap(r1,c1,r2,c2){
  const t=game.grid[r1][c1];game.grid[r1][c1]=game.grid[r2][c2];game.grid[r2][c2]=t;
}
function findMatches(){
  const matched=new Set();
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS-2;c++){
    const t=game.grid[r][c];
    if(t===game.grid[r][c+1]&&t===game.grid[r][c+2]){
      matched.add(r+','+c);matched.add(r+','+(c+1));matched.add(r+','+(c+2));
    }
  }
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS-2;r++){
    const t=game.grid[r][c];
    if(t===game.grid[r+1][c]&&t===game.grid[r+2][c]){
      matched.add(r+','+c);matched.add((r+1)+','+c);matched.add((r+2)+','+c);
    }
  }
  return [...matched].map(s=>s.split(',').map(Number));
}
function processMatches(matches){
  const types=[...new Set(matches.map(([r,c])=>game.grid[r][c]))];
  const chord=types.map(t=>NOTE_FREQS[t]);
  playChord(chord,.4);
  game.score+=matches.length*10;
  scoreEl.textContent=game.score;
  matches.forEach(([r,c])=>{
    const el=board.children[r*COLS+c];
    if(el)el.classList.add('matched');
  });
  setTimeout(()=>{
    matches.forEach(([r,c])=>game.grid[r][c]=-1);
    for(let c=0;c<COLS;c++){
      let write=ROWS-1;
      for(let r=ROWS-1;r>=0;r--){
        if(game.grid[r][c]!==-1){game.grid[write][c]=game.grid[r][c];if(write!==r)game.grid[r][c]=-1;write--;}
      }
      for(let r=write;r>=0;r--)game.grid[r][c]=Math.floor(Math.random()*6);
    }
    render();
    const newMatches=findMatches();
    if(newMatches.length>0)setTimeout(()=>processMatches(newMatches),200);
    else{game.animating=false;if(game.moves<=0)endGame();}
  },300);
}
function startGame(){
  initAudio();
  game.score=0;game.moves=30;game.selected=null;game.animating=false;
  scoreEl.textContent=0;movesEl.textContent=30;
  initGrid();render();
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  game.running=true;
}
function endGame(){
  game.running=false;
  if(game.score>best){best=game.score;try{localStorage.setItem('noteMatch_best',best)}catch(e){}}
  document.getElementById('best').textContent=best;
  document.getElementById('finalScore').textContent=game.score;
  document.getElementById('finalBest').textContent=best;
  document.getElementById('endScreen').classList.remove('hidden');
}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('restartBtn').onclick=startGame;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.running)game.running=false;});
</script>
