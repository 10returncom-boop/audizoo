body{background:#0a1a0a;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;user-select:none;touch-action:none}

.tower-btn.t0{border-color:#f44;color:#f44}

.overlay h1{font-size:34px;background:linear-gradient(90deg,#0f0,#ff0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.overlay p{font-size:15px;color:#aaa;text-align:center;line-height:1.8;max-width:350px}
.overlay button{padding:14px 40px;font-size:20px;font-weight:bold;border:none;border-radius:30px;background:linear-gradient(90deg,#0f0,#ff0);color:#000;cursor:pointer}
.overlay .stats{font-size:18px;line-height:2;text-align:center}
.overlay .stats b{color:#0f0}
.hidden{display:none!important}

<body>
<div id="game">
  <div id="hud">
    <span>金幣：<span id="gold">100</span></span>
    <span>生命：<span id="lives">10</span></span>
    <span>波次：<span id="wave">1</span></span>
    <span>最高：<span id="best">0</span></span>
  </div>
  <canvas id="cv"></canvas>
  <div id="tower-bar">
    <div class="tower-btn t0" data-tower="0">鼓塔 50</div>
    <div class="tower-btn t1" data-tower="1">琴塔 80</div>
    <div class="tower-btn t2" data-tower="2">號角塔 120</div>
    <div class="tower-btn t3" data-tower="3">鈸塔 150</div>
  </div>
  <div id="startScreen" class="overlay">
    <h1>音樂塔防</h1>
    <p>敵人沿著路徑前進，放置音樂塔防禦！<br>每座塔攻擊時都會發出獨特的樂器聲音<br>點選下方塔按鈕選擇，再點選空地放置<br>消滅敵人獲得金幣，別讓敵人到達終點！</p>
    <button id="startBtn">開始遊戲</button>
  </div>
  <div id="endScreen" class="overlay hidden">
    <h2>遊戲結束</h2>
    <div class="stats">
      到達波次：<b id="finalWave">1</b><br>
      歷史最高：<b id="finalBest">0</b>
    </div>
    <button id="restartBtn">再來一局</button>
  </div>
</div>
<script>
const AC=window.AudioContext||window.webkitAudioContext;
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume()}
function playTowerSound(type){
  if(!audioCtx)return;
  const freqs=[[150,80],[523,659],[440,880],[8000,12000]];
  const types=['sawtooth','sine','triangle','square'];
  const f=freqs[type];
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=types[type];o.frequency.setValueAtTime(f[0],audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(f[1],audioCtx.currentTime+.1);
  g.gain.setValueAtTime(.12,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.15);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.15);
}
const cv=document.getElementById('cv');const ctx=cv.getContext('2d');
let W,H,TILE;
const PATH=[{x:0,y:2},{x:3,y:2},{x:3,y:5},{x:7,y:5},{x:7,y:1},{x:10,y:1},{x:10,y:6},{x:12,y:6}];
const TOWER_INFO=[
  {name:'鼓塔',cost:50,range:80,damage:15,rate:1.0,color:'#f44'},
  {name:'琴塔',cost:80,range:100,damage:10,rate:0.5,color:'#0ff'},
  {name:'號角塔',cost:120,range:120,damage:25,rate:1.5,color:'#ff0'},
  {name:'鈸塔',cost:150,range:90,damage:8,rate:0.3,color:'#0f0'},
];
const game={gold:100,lives:10,wave:1,running:false,towers:[],enemies:[],projectiles:[],selectedTower:-1,spawnTimer:0,enemiesToSpawn:0,lastTime:0,waveActive:false};
const goldEl=document.getElementById('gold');
const livesEl=document.getElementById('lives');
const waveEl=document.getElementById('wave');
let best=0;
try{best=parseInt(localStorage.getItem('musicTD_best')||'0')}catch(e){}
document.getElementById('best').textContent=best;

function resize(){
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;
  ctx.scale(devicePixelRatio,devicePixelRatio);
  TILE=Math.min(W/13,H/8);
}
window.addEventListener('resize',resize);

function isOnPath(gx,gy){
  for(let i=0;i<PATH.length-1;i++){
    const a=PATH[i],b=PATH[i+1];
    if(a.x===b.x){
      if(gx===a.x&&gy>=Math.min(a.y,b.y)&&gy<=Math.max(a.y,b.y))return true;
    }else{
      if(gy===a.y&&gx>=Math.min(a.x,b.x)&&gx<=Math.max(a.x,b.x))return true;
    }
  }
  return false;
}
function pathPosition(progress){
  let total=0;
  const segs=[];
  for(let i=0;i<PATH.length-1;i++){
    const len=Math.abs(PATH[i+1].x-PATH[i].x)+Math.abs(PATH[i+1].y-PATH[i].y);
    segs.push(len);total+=len;
  }
  let target=progress*total;
  for(let i=0;i<segs.length;i++){
    if(target<=segs[i]){
      const a=PATH[i],b=PATH[i+1];
      const t=target/segs[i];
      return{x:(a.x+(b.x-a.x)*t+.5)*TILE,y:(a.y+(b.y-a.y)*t+.5)*TILE};
    }
    target-=segs[i];
  }
  return{x:(PATH[PATH.length-1].x+.5)*TILE,y:(PATH[PATH.length-1].y+.5)*TILE};
}
function spawnEnemy(){
  const hp=30+game.wave*15;
  game.enemies.push({progress:0,hp,maxHp:hp,speed:.0008+game.wave*.0001,reward:10+game.wave*2});
}
function placeTower(gx,gy){
  if(game.selectedTower<0)return;
  const info=TOWER_INFO[game.selectedTower];
  if(game.gold<info.cost)return;
  if(isOnPath(gx,gy))return;
  if(game.towers.some(t=>t.gx===gx&&t.gy===gy))return;
  game.gold-=info.cost;
  game.towers.push({gx,gy,type:game.selectedTower,cooldown:0,...info});
  goldEl.textContent=game.gold;
  playTowerSound(game.selectedTower);
}
function loop(t){
  if(!game.running)return;
  const dt=Math.min((t-game.lastTime)/1000,.05);
  game.lastTime=t;
  if(game.waveActive&&game.enemiesToSpawn>0){
    game.spawnTimer+=dt;
    if(game.spawnTimer>=.8){game.spawnTimer=0;spawnEnemy();game.enemiesToSpawn--;}
  }
  for(let i=game.enemies.length-1;i>=0;i--){
    const e=game.enemies[i];
    e.progress+=e.speed*dt*1000;
    if(e.progress>=1){
      game.enemies.splice(i,1);game.lives--;livesEl.textContent=game.lives;
      if(game.lives<=0){endGame();return;}
      continue;
    }
    if(e.hp<=0){
      game.enemies.splice(i,1);game.gold+=e.reward;goldEl.textContent=game.gold;
    }
  }
  for(const tower of game.towers){
    tower.cooldown-=dt;
    if(tower.cooldown<=0){
      const tx=(tower.gx+.5)*TILE,ty=(tower.gy+.5)*TILE;
      let target=null,maxProg=-1;
      for(const e of game.enemies){
        const pos=pathPosition(e.progress);
        const d=Math.sqrt((pos.x-tx)**2+(pos.y-ty)**2);
        if(d<tower.range&&e.progress>maxProg){maxProg=e.progress;target=e;}
      }
      if(target){
        tower.cooldown=tower.rate;
        const pos=pathPosition(target.progress);
        game.projectiles.push({x:tx,y:ty,tx:pos.x,ty:pos.y,target,damage:tower.damage,color:tower.color,speed:300});
        playTowerSound(tower.type);
      }
    }
  }
  for(let i=game.projectiles.length-1;i>=0;i--){
    const p=game.projectiles[i];
    if(!p.target||p.target.hp<=0){game.projectiles.splice(i,1);continue;}
    const pos=pathPosition(p.target.progress);
    p.tx=pos.x;p.ty=pos.y;
    const dx=p.tx-p.x,dy=p.ty-p.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<10){
      p.target.hp-=p.damage;
      game.projectiles.splice(i,1);
    }else{
      p.x+=dx/d*p.speed*dt;p.y+=dy/d*p.speed*dt;
    }
  }
  if(game.waveActive&&game.enemiesToSpawn===0&&game.enemies.length===0){
    game.waveActive=false;
    game.wave++;waveEl.textContent=game.wave;
    game.gold+=50;goldEl.textContent=game.gold;
    setTimeout(()=>{if(game.running){game.enemiesToSpawn=5+game.wave*2;game.waveActive=true;game.spawnTimer=0;}},2000);
  }
  draw();
  requestAnimationFrame(loop);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0d1a0d';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.05)';
  for(let x=0;x<=13;x++){ctx.beginPath();ctx.moveTo(x*TILE,0);ctx.lineTo(x*TILE,H);ctx.stroke();}
  for(let y=0;y<=8;y++){ctx.beginPath();ctx.moveTo(0,y*TILE);ctx.lineTo(W,y*TILE);ctx.stroke();}
  ctx.strokeStyle='#5a4a2a';ctx.lineWidth=TILE*.7;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo((PATH[0].x+.5)*TILE,(PATH[0].y+.5)*TILE);
  for(let i=1;i<PATH.length;i++)ctx.lineTo((PATH[i].x+.5)*TILE,(PATH[i].y+.5)*TILE);
  ctx.stroke();
  ctx.fillStyle='#0f0';ctx.beginPath();ctx.arc((PATH[0].x+.5)*TILE,(PATH[0].y+.5)*TILE,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f44';ctx.beginPath();ctx.arc((PATH[PATH.length-1].x+.5)*TILE,(PATH[PATH.length-1].y+.5)*TILE,10,0,Math.PI*2);ctx.fill();
  for(const tower of game.towers){
    const x=(tower.gx+.5)*TILE,y=(tower.gy+.5)*TILE;
    ctx.fillStyle=tower.color;ctx.shadowColor=tower.color;ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(x,y,TILE*.35,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(tower.name[0],x,y);
  }
  for(const e of game.enemies){
    const pos=pathPosition(e.progress);
    ctx.fillStyle='#f80';ctx.shadowColor='#f80';ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(pos.x,pos.y,12,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#333';ctx.fillRect(pos.x-15,pos.y-20,30,4);
    ctx.fillStyle='#0f0';ctx.fillRect(pos.x-15,pos.y-20,30*(e.hp/e.maxHp),4);
  }
  for(const p of game.projectiles){
    ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }
}
function startGame(){
  initAudio();resize();
  game.gold=100;game.lives=10;game.wave=1;game.towers=[];game.enemies=[];game.projectiles=[];
  game.selectedTower=-1;game.enemiesToSpawn=7;game.waveActive=true;game.spawnTimer=0;
  goldEl.textContent=100;livesEl.textContent=10;waveEl.textContent=1;
  document.querySelectorAll('.tower-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  game.running=true;game.lastTime=performance.now();
  requestAnimationFrame(loop);
}
function endGame(){
  game.running=false;
  if(game.wave>best){best=game.wave;try{localStorage.setItem('musicTD_best',best)}catch(e){}}
  document.getElementById('best').textContent=best;
  document.getElementById('finalWave').textContent=game.wave;
  document.getElementById('finalBest').textContent=best;
  document.getElementById('endScreen').classList.remove('hidden');
}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('restartBtn').onclick=startGame;
document.querySelectorAll('.tower-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    game.selectedTower=parseInt(b.dataset.tower);
    document.querySelectorAll('.tower-btn').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
  });
});
cv.addEventListener('pointerdown',e=>{
  if(!game.running)return;
  e.preventDefault();initAudio();
  const rect=cv.getBoundingClientRect();
  const gx=Math.floor((e.clientX-rect.left)/TILE);
  const gy=Math.floor((e.clientY-rect.top)/TILE);
  placeTower(gx,gy);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.running)game.running=false;});
resize();draw();
</script>
</body>
