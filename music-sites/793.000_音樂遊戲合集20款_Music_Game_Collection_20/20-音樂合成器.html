<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;user-select:none;touch-action:none}
#game{position:relative;width:100%;max-width:600px;height:100%;display:flex;flex-direction:column;padding:10px;gap:10px}
#title{text-align:center;font-size:20px;font-weight:bold;background:linear-gradient(90deg,#0ff,#f0f,#ff0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.ctrl-group{display:flex;flex-direction:column;gap:4px;align-items:center}
.ctrl-label{font-size:11px;color:#888}
.inst-btn{padding:8px 14px;font-size:13px;font-weight:bold;border:2px solid #444;border-radius:8px;cursor:pointer;transition:all .1s;background:rgba(0,0,0,.3);color:#aaa}
.inst-btn.active{border-color:#0ff;color:#0ff;background:rgba(0,255,255,.1);box-shadow:0 0 10px rgba(0,255,255,.3)}
#keyboard{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:0;position:relative;min-height:200px}
.white-keys{display:flex;height:60%;gap:2px}
.black-keys{position:absolute;top:0;left:0;right:0;height:35%;display:flex;pointer-events:none}
.white-key{flex:1;background:linear-gradient(180deg,#fff,#ddd);border:1px solid #999;border-radius:0 0 6px 6px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:10px;color:#666;font-weight:bold;transition:all .05s}
.white-key:active,.white-key.active{background:linear-gradient(180deg,#0ff,#0aa);transform:translateY(2px)}
.black-key-container{flex:1;position:relative}
.black-key{position:absolute;top:0;width:60%;height:100%;background:linear-gradient(180deg,#333,#000);border:1px solid #000;border-radius:0 0 4px 4px;cursor:pointer;z-index:2;pointer-events:auto;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:9px;color:#888;font-weight:bold;transition:all .05s}
.black-key:active,.black-key.active{background:linear-gradient(180deg,#f0f,#a0a);transform:translateY(2px)}
.black-key.left{left:70%}
.black-key.right{right:70%}
#sequencer{display:flex;flex-direction:column;gap:4px;background:rgba(0,0,0,.3);padding:8px;border-radius:8px}
.seq-row{display:flex;gap:3px;align-items:center}
.seq-label{width:30px;font-size:11px;color:#888;text-align:right}
.seq-cells{display:flex;gap:2px;flex:1}
.seq-cell{flex:1;height:18px;background:#222;border-radius:3px;cursor:pointer;transition:all .1s}
.seq-cell.active{background:#0ff;box-shadow:0 0 8px #0ff}
.seq-cell.current{outline:2px solid #ff0}
#seq-controls{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:4px}
.seq-btn{padding:6px 16px;font-size:13px;font-weight:bold;border:2px solid;border-radius:6px;cursor:pointer;transition:all .1s;background:rgba(0,0,0,.3)}
.seq-btn.play{border-color:#0f0;color:#0f0}
.seq-btn.stop{border-color:#f44;color:#f44}
.seq-btn.clear{border-color:#888;color:#888}
.seq-btn:active{transform:scale(.95)}
#tempo{width:80px;font-size:12px;background:#222;color:#fff;border:1px solid #444;border-radius:4px;padding:4px;text-align:center}
#status{text-align:center;font-size:12px;color:#666;min-height:16px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:20px;padding:20px}
.overlay h1{font-size:32px;background:linear-gradient(90deg,#0ff,#f0f,#ff0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.overlay p{font-size:14px;color:#aaa;text-align:center;line-height:1.8;max-width:400px}
.overlay button{padding:14px 40px;font-size:18px;font-weight:bold;border:none;border-radius:30px;background:linear-gradient(90deg,#0ff,#f0f);color:#000;cursor:pointer}
.hidden{display:none!important}
</style>

<body>
<div id="game">
  <div id="title">音樂合成器</div>
  <div id="controls">
    <div class="ctrl-group">
      <div class="ctrl-label">樂器</div>
      <div style="display:flex;gap:4px">
        <button class="inst-btn active" data-inst="sine">正弦</button>
        <button class="inst-btn" data-inst="square">方波</button>
        <button class="inst-btn" data-inst="sawtooth">鋸齒</button>
        <button class="inst-btn" data-inst="triangle">三角</button>
      </div>
    </div>
  </div>
  <div id="keyboard">
    <div class="white-keys" id="whiteKeys"></div>
    <div class="black-keys" id="blackKeys"></div>
  </div>
  <div id="sequencer">
    <div id="seqRows"></div>
    <div id="seq-controls">
      <button class="seq-btn play" id="playSeq">播放</button>
      <button class="seq-btn stop" id="stopSeq">停止</button>
      <button class="seq-btn clear" id="clearSeq">清除</button>
      <span style="font-size:11px;color:#888">BPM</span>
      <input type="number" id="tempo" value="120" min="60" max="200">
    </div>
  </div>
  <div id="status">點選琴鍵演奏，或在下方編曲器創作旋律</div>
  <div id="startScreen" class="overlay">
    <h1>音樂合成器</h1>
    <p>創造屬於你的音樂！<br>點選琴鍵即時演奏不同音符<br>切換四種樂器音色（正弦/方波/鋸齒/三角）<br>使用下方 16 步編曲器創作迴圈旋律<br>調整 BPM 控制播放速度<br>鍵盤 A S D F G H J K 對應白鍵，W E T Y U 對應黑鍵</p>
    <button id="startBtn">開始創作</button>
  </div>
</div>
<script>
const AC=window.AudioContext||window.webkitAudioContext;
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume()}
const activeOscs={};
function playNote(freq,inst='sine',dur=.3,vol=.2){
  if(!audioCtx||freq<=0)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=inst;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
  return{o,g};
}
function startNote(freq,inst){
  if(!audioCtx||activeOscs[freq])return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=inst;o.frequency.value=freq;
  g.gain.setValueAtTime(.15,audioCtx.currentTime);
  o.connect(g);g.connect(audioCtx.destination);o.start();
  activeOscs[freq]={o,g};
}
function stopNote(freq){
  if(activeOscs[freq]){
    const {o,g}=activeOscs[freq];
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.1);
    o.stop(audioCtx.currentTime+.1);
    delete activeOscs[freq];
  }
}
const NOTES=[
  {name:'C',freq:261.63,black:false,key:'a'},
  {name:'C#',freq:277.18,black:true,key:'w'},
  {name:'D',freq:293.66,black:false,key:'s'},
  {name:'D#',freq:311.13,black:true,key:'e'},
  {name:'E',freq:329.63,black:false,key:'d'},
  {name:'F',freq:349.23,black:false,key:'f'},
  {name:'F#',freq:369.99,black:true,key:'t'},
  {name:'G',freq:392,black:false,key:'g'},
  {name:'G#',freq:415.3,black:true,key:'y'},
  {name:'A',freq:440,black:false,key:'h'},
  {name:'A#',freq:466.16,black:true,key:'u'},
  {name:'B',freq:493.88,black:false,key:'j'},
  {name:'C2',freq:523.25,black:false,key:'k'},
];
const SEQ_NOTES=['C2','B','A','G','F','E','D','C'];
const STEPS=16;
const game={inst:'sine',seq:[],seqPlaying:false,seqStep:0,seqTimer:null};
const whiteKeysEl=document.getElementById('whiteKeys');
const blackKeysEl=document.getElementById('blackKeys');
const statusEl=document.getElementById('status');
NOTES.forEach((n,i)=>{
  if(!n.black){
    const k=document.createElement('div');
    k.className='white-key';k.dataset.freq=n.freq;k.dataset.inst=game.inst;
    k.textContent=n.name+(n.key?' ('+n.key.toUpperCase()+')':'');
    k.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();startNote(n.freq,game.inst);k.classList.add('active');statusEl.textContent='演奏：'+n.name+' ('+n.freq.toFixed(1)+'Hz)';});
    k.addEventListener('pointerup',()=>{stopNote(n.freq);k.classList.remove('active');});
    k.addEventListener('pointerleave',()=>{stopNote(n.freq);k.classList.remove('active');});
    whiteKeysEl.appendChild(k);
  }
});
const whiteNoteIdxs=NOTES.map((n,i)=>!n.black?i:-1).filter(i=>i>=0);
whiteNoteIdxs.forEach((idx,wi)=>{
  const n=NOTES[idx];
  const container=document.createElement('div');
  container.className='black-key-container';
  const nextWhite=NOTES[idx+1];
  const prevWhiteIdx=wi>0?whiteNoteIdxs[wi-1]:-1;
  const hasPrevBlack=prevWhiteIdx>=0&&NOTES[prevWhiteIdx+1]&&NOTES[prevWhiteIdx+1].black;
  const hasNextBlack=NOTES[idx+1]&&NOTES[idx+1].black;
  if(hasNextBlack){
    const bn=NOTES[idx+1];
    const bk=document.createElement('div');
    bk.className='black-key left';bk.dataset.freq=bn.freq;
    bk.textContent=bn.name+(bn.key?' '+bn.key.toUpperCase():'');
    bk.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();initAudio();startNote(bn.freq,game.inst);bk.classList.add('active');statusEl.textContent='演奏：'+bn.name+' ('+bn.freq.toFixed(1)+'Hz)';});
    bk.addEventListener('pointerup',()=>{stopNote(bn.freq);bk.classList.remove('active');});
    bk.addEventListener('pointerleave',()=>{stopNote(bn.freq);bk.classList.remove('active');});
    container.appendChild(bk);
  }
  blackKeysEl.appendChild(container);
});
document.querySelectorAll('.inst-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.inst-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    game.inst=b.dataset.inst;
    statusEl.textContent='樂器：'+b.textContent;
    initAudio();
    playNote(440,game.inst,.2);
  });
});
const seqRowsEl=document.getElementById('seqRows');
SEQ_NOTES.forEach((noteName,ri)=>{
  const row=document.createElement('div');row.className='seq-row';
  const label=document.createElement('div');label.className='seq-label';label.textContent=noteName;
  const cells=document.createElement('div');cells.className='seq-cells';
  game.seq[ri]=Array(STEPS).fill(false);
  for(let s=0;s<STEPS;s++){
    const cell=document.createElement('div');cell.className='seq-cell';
    cell.addEventListener('click',()=>{
      game.seq[ri][s]=!game.seq[ri][s];
      cell.classList.toggle('active');
      if(game.seq[ri][s]){
        const n=NOTES.find(x=>x.name===noteName||(noteName==='C2'&&x.name==='C2'));
        if(n)playNote(n.freq,game.inst,.15);
      }
    });
    cells.appendChild(cell);
  }
  row.appendChild(label);row.appendChild(cells);
  seqRowsEl.appendChild(row);
});
function playSeqStep(){
  document.querySelectorAll('.seq-cell').forEach(c=>c.classList.remove('current'));
  let played=false;
  for(let r=0;r<SEQ_NOTES.length;r++){
    if(game.seq[r][game.seqStep]){
      const noteName=SEQ_NOTES[r];
      const n=NOTES.find(x=>x.name===noteName);
      if(n){playNote(n.freq,game.inst,.25,.2);played=true;}
    }
  }
  for(let r=0;r<SEQ_NOTES.length;r++){
    const cells=seqRowsEl.children[r].querySelector('.seq-cells').children;
    if(cells[game.seqStep])cells[game.seqStep].classList.add('current');
  }
  game.seqStep=(game.seqStep+1)%STEPS;
}
document.getElementById('playSeq').addEventListener('click',()=>{
  if(game.seqPlaying)return;
  initAudio();
  game.seqPlaying=true;game.seqStep=0;
  const bpm=parseInt(document.getElementById('tempo').value)||120;
  const interval=60000/bpm/4;
  game.seqTimer=setInterval(playSeqStep,interval);
  statusEl.textContent='播放中... BPM: '+bpm;
});
document.getElementById('stopSeq').addEventListener('click',()=>{
  game.seqPlaying=false;
  if(game.seqTimer)clearInterval(game.seqTimer);
  document.querySelectorAll('.seq-cell').forEach(c=>c.classList.remove('current'));
  statusEl.textContent='已停止';
});
document.getElementById('clearSeq').addEventListener('click',()=>{
  for(let r=0;r<SEQ_NOTES.length;r++)for(let s=0;s<STEPS;s++)game.seq[r][s]=false;
  document.querySelectorAll('.seq-cell').forEach(c=>c.classList.remove('active'));
  statusEl.textContent='編曲器已清除';
});
document.getElementById('tempo').addEventListener('change',()=>{
  if(game.seqPlaying){
    clearInterval(game.seqTimer);
    const bpm=parseInt(document.getElementById('tempo').value)||120;
    game.seqTimer=setInterval(playSeqStep,60000/bpm/4);
  }
});
const keyMap={};
NOTES.forEach(n=>{if(n.key)keyMap[n.key]=n;});
document.addEventListener('keydown',e=>{
  if(e.repeat)return;
  const n=keyMap[e.key.toLowerCase()];
  if(n){
    e.preventDefault();initAudio();
    startNote(n.freq,game.inst);
    const allKeys=[...document.querySelectorAll('.white-key'),...document.querySelectorAll('.black-key')];
    const k=allKeys.find(x=>parseFloat(x.dataset.freq)===n.freq);
    if(k)k.classList.add('active');
    statusEl.textContent='演奏：'+n.name;
  }
});
document.addEventListener('keyup',e=>{
  const n=keyMap[e.key.toLowerCase()];
  if(n){
    stopNote(n.freq);
    const allKeys=[...document.querySelectorAll('.white-key'),...document.querySelectorAll('.black-key')];
    const k=allKeys.find(x=>parseFloat(x.dataset.freq)===n.freq);
    if(k)k.classList.remove('active');
  }
});
document.getElementById('startBtn').addEventListener('click',()=>{
  document.getElementById('startScreen').classList.add('hidden');
  initAudio();
});
</script>
</body>
