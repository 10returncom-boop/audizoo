<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;user-select:none;touch-action:none}
#game{position:relative;width:100%;max-width:500px;height:100%;display:flex;flex-direction:column}
#hud{display:flex;justify-content:space-between;padding:12px 16px;font-size:16px;z-index:10}
#score{color:#0ff;font-weight:bold}
#combo{color:#ff0;font-weight:bold}
#best{color:#f80;font-weight:bold}
#playfield{flex:1;position:relative;overflow:hidden;background:#0d0d2b}
.letter{position:absolute;font-size:32px;font-weight:bold;width:50px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:none}
.letter.l0{background:rgba(0,255,255,.2);color:#0ff;border:2px solid #0ff;box-shadow:0 0 10px #0ff}
.letter.l1{background:rgba(255,0,255,.2);color:#f0f;border:2px solid #f0f;box-shadow:0 0 10px #f0f}
.letter.l2{background:rgba(255,255,0,.2);color:#ff0;border:2px solid #ff0;box-shadow:0 0 10px #ff0}
.letter.l3{background:rgba(0,255,0,.2);color:#0f0;border:2px solid #0f0;box-shadow:0 0 10px #0f0}
.letter.hit{animation:hitAnim .2s forwards}
@keyframes hitAnim{0%{transform:scale(1)}50%{transform:scale(1.5);opacity:.5}100%{transform:scale(0);opacity:0}}
#hitline{position:absolute;bottom:60px;left:0;right:0;height:3px;background:rgba(255,255,255,.3);z-index:5}
#judge{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-size:28px;font-weight:bold;opacity:0;transition:opacity .15s;z-index:20;pointer-events:none}
#keyboard{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;padding:8px;background:#111}
.kb-key{display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;background:#222;border:1px solid #444;border-radius:4px;height:36px;cursor:pointer;transition:all .1s;color:#aaa}
.kb-key:active,.kb-key.active{background:#0ff;color:#000;transform:scale(.9)}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:20px;padding:20px}
.overlay h1{font-size:34px;background:linear-gradient(90deg,#0ff,#f0f);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.overlay p{font-size:15px;color:#aaa;text-align:center;line-height:1.8;max-width:350px}
.overlay button{padding:14px 40px;font-size:20px;font-weight:bold;border:none;border-radius:30px;background:linear-gradient(90deg,#0ff,#f0f);color:#000;cursor:pointer}
.overlay .stats{font-size:18px;line-height:2;text-align:center}
.overlay .stats b{color:#0ff}
.hidden{display:none!important}
</style>

<body>
<div id="game">
  <div id="hud">
    <span>分數：<span id="score">0</span></span>
    <span>連擊：<span id="combo">0</span></span>
    <span>最高：<span id="best">0</span></span>
  </div>
  <div id="playfield">
    <div id="hitline"></div>
    <div id="judge"></div>
  </div>
  <div id="keyboard"></div>
  <div id="startScreen" class="overlay">
    <h1>節奏打字</h1>
    <p>字母從天而降，在到達判定線時輸入對應字母！<br>可以用實體鍵盤或點選下方虛擬鍵盤<br>每打中一個字母就會彈出對應音高<br>連擊越多，速度越快！</p>
    <button id="startBtn">開始遊戲</button>
  </div>
  <div id="endScreen" class="overlay hidden">
    <h2>遊戲結束</h2>
    <div class="stats">
      本局分數：<b id="finalScore">0</b><br>
      最高連擊：<b id="finalCombo">0</b><br>
      歷史最高：<b id="finalBest">0</b>
    </div>
    <button id="restartBtn">再來一局</button>
  </div>
</div>
<script>
const AC=window.AudioContext||window.webkitAudioContext;
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume()}
function playLetterNote(char){
  if(!audioCtx)return;
  const idx=char.toUpperCase().charCodeAt(0)-65;
  const freq=261.63*Math.pow(2,idx/12);
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(.2,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.2);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.2);
}
const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const game={score:0,combo:0,maxCombo:0,letters:[],running:false,speed:2,spawnTimer:0,spawnInterval:1.5,lastTime:0,missCount:0};
const pf=document.getElementById('playfield');
const judgeEl=document.getElementById('judge');
const scoreEl=document.getElementById('score');
const comboEl=document.getElementById('combo');
let best=0;
try{best=parseInt(localStorage.getItem('rhythmTyping_best')||'0')}catch(e){}
document.getElementById('best').textContent=best;

const kb=document.getElementById('keyboard');
const kbRows=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
kbRows.forEach(row=>{
  for(const ch of row){
    const k=document.createElement('div');
    k.className='kb-key';k.textContent=ch;k.dataset.key=ch;
    k.addEventListener('pointerdown',e=>{e.preventDefault();typeLetter(ch);});
    kb.appendChild(k);
  }
  kb.appendChild(document.createElement('div')).style.gridColumn='span '+(10-row.length);
});

function showJudge(text,color){judgeEl.textContent=text;judgeEl.style.color=color;judgeEl.style.opacity='1';setTimeout(()=>judgeEl.style.opacity='0',250);}

function spawnLetter(){
  const ch=LETTERS[Math.floor(Math.random()*LETTERS.length)];
  const el=document.createElement('div');
  el.className='letter l'+Math.floor(Math.random()*4);
  el.textContent=ch;
  const pfW=pf.clientWidth;
  el.style.left=(Math.random()*(pfW-60)+5)+'px';
  el.style.top='-50px';
  pf.appendChild(el);
  game.letters.push({el,char:ch,y:-50,hit:false});
}

function typeLetter(ch){
  if(!game.running)return;
  initAudio();
  ch=ch.toUpperCase();
  const key=document.querySelector('.kb-key[data-key="'+ch+'"]');
  if(key){key.classList.add('active');setTimeout(()=>key.classList.remove('active'),100);}
  const pfH=pf.clientHeight;
  const hitY=pfH-60;
  let closest=null,closestDist=Infinity;
  for(const l of game.letters){
    if(l.char===ch&&!l.hit){
      const d=Math.abs(l.y-hitY);
      if(d<closestDist){closestDist=d;closest=l;}
    }
  }
  if(closest&&closestDist<60){
    closest.hit=true;
    closest.el.classList.add('hit');
    setTimeout(()=>closest.el.remove(),200);
    if(closestDist<25){game.score+=100;showJudge('PERFECT','#0ff');}
    else{game.score+=50;showJudge('GOOD','#0f0');}
    game.combo++;game.maxCombo=Math.max(game.maxCombo,game.combo);
    playLetterNote(ch);
    if(game.combo%10===0){game.speed=Math.min(5,game.speed+.2);game.spawnInterval=Math.max(.7,game.spawnInterval-.08);}
  }else{
    game.combo=0;
    showJudge('MISS','#f44');
  }
  scoreEl.textContent=game.score;comboEl.textContent=game.combo;
}

function loop(t){
  if(!game.running)return;
  const dt=Math.min((t-game.lastTime)/1000,.05);
  game.lastTime=t;
  game.spawnTimer+=dt;
  if(game.spawnTimer>=game.spawnInterval){game.spawnTimer=0;spawnLetter();}
  const pfH=pf.clientHeight;
  for(let i=game.letters.length-1;i>=0;i--){
    const l=game.letters[i];
    l.y+=game.speed*60*dt;
    l.el.style.top=l.y+'px';
    if(l.y>pfH-30&&!l.hit){
      l.hit=true;l.el.remove();
      game.combo=0;game.missCount++;
      showJudge('MISS','#f44');
      scoreEl.textContent=game.score;comboEl.textContent=game.combo;
      if(game.missCount>=15){endGame();return;}
    }
  }
  game.letters=game.letters.filter(l=>!l.hit);
  requestAnimationFrame(loop);
}

function startGame(){
  initAudio();
  game.score=0;game.combo=0;game.maxCombo=0;game.letters.forEach(l=>l.el.remove());
  game.letters=[];game.speed=2;game.spawnTimer=0;game.spawnInterval=1.5;game.missCount=0;
  scoreEl.textContent=0;comboEl.textContent=0;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  game.running=true;game.lastTime=performance.now();
  requestAnimationFrame(loop);
}
function endGame(){
  game.running=false;
  game.letters.forEach(l=>l.el.remove());game.letters=[];
  if(game.score>best){best=game.score;try{localStorage.setItem('rhythmTyping_best',best)}catch(e){}}
  document.getElementById('best').textContent=best;
  document.getElementById('finalScore').textContent=game.score;
  document.getElementById('finalCombo').textContent=game.maxCombo;
  document.getElementById('finalBest').textContent=best;
  document.getElementById('endScreen').classList.remove('hidden');
}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('restartBtn').onclick=startGame;
document.addEventListener('keydown',e=>{
  if(e.key.length===1&&/[a-zA-Z]/.test(e.key))typeLetter(e.key);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.running)game.running=false;});
</script>
</body>
