<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a0a0a;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;user-select:none;touch-action:none}
#game{position:relative;width:100%;max-width:500px;height:100%;display:flex;flex-direction:column}
#hud{display:flex;justify-content:space-between;padding:12px 16px;font-size:18px;z-index:10}
#score{color:#fa0;font-weight:bold}
#combo{color:#ff0;font-weight:bold}
#best{color:#f44;font-weight:bold}
#playfield{flex:1;position:relative;overflow:hidden}
#hitzone{position:absolute;bottom:100px;left:0;right:0;height:60px;display:flex;justify-content:center;align-items:center;gap:10px;z-index:5}
.drum-hit{width:70px;height:70px;border-radius:50%;border:3px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;transition:all .1s}
.drum-hit.active{transform:scale(1.2);border-color:#fff;background:rgba(255,255,255,.2)}
.note{position:absolute;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px;transition:none}
.note.d0{background:radial-gradient(circle,#ff6644,#cc2200);box-shadow:0 0 15px #ff4422}
.note.d1{background:radial-gradient(circle,#ffaa44,#cc7700);box-shadow:0 0 15px #ffaa22}
.note.d2{background:radial-gradient(circle,#44aaff,#0066cc);box-shadow:0 0 15px #2288ff}
.note.d3{background:radial-gradient(circle,#aa44ff,#6600cc);box-shadow:0 0 15px #8822ff}
#keys{display:flex;justify-content:center;gap:10px;padding:10px;height:90px}
.drum-key{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;cursor:pointer;transition:transform .1s;border:3px solid}
.drum-key.k0{background:rgba(255,68,34,.2);border-color:#ff4422;color:#ff6644}
.drum-key.k1{background:rgba(255,170,34,.2);border-color:#ffaa22;color:#ffaa44}
.drum-key.k2{background:rgba(34,136,255,.2);border-color:#2288ff;color:#44aaff}
.drum-key.k3{background:rgba(136,34,255,.2);border-color:#8822ff;color:#aa44ff}
.drum-key.active{transform:scale(.9);background:rgba(255,255,255,.3)}
#judge{position:absolute;top:35%;left:50%;transform:translateX(-50%);font-size:28px;font-weight:bold;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}
#judge.perfect{color:#0ff;opacity:1}
#judge.good{color:#0f0;opacity:1}
#judge.miss{color:#f44;opacity:1}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:20px}
.overlay h1{font-size:38px;background:linear-gradient(90deg,#f44,#fa0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.overlay p{font-size:16px;color:#aaa;text-align:center;line-height:1.8}
.overlay button{padding:14px 40px;font-size:20px;font-weight:bold;border:none;border-radius:30px;background:linear-gradient(90deg,#f44,#fa0);color:#000;cursor:pointer}
.overlay .stats{font-size:20px;line-height:2;text-align:center}
.overlay .stats b{color:#fa0}
.hidden{display:none!important}
</style>

<body>
<div id="game">
  <div id="hud">
    <span>分數：<span id="score">0</span></span>
    <span>連擊：<span id="combo">0</span></span>
    <span>最高：<span id="best">0</span></span>
  </div>
  <div id="playfield">
    <div id="hitzone">
      <div class="drum-hit" data-d="0">KICK</div>
      <div class="drum-hit" data-d="1">SNARE</div>
      <div class="drum-hit" data-d="2">TOM</div>
      <div class="drum-hit" data-d="3">CYMBAL</div>
    </div>
    <div id="judge"></div>
  </div>
  <div id="keys">
    <div class="drum-key k0" data-d="0">D<br>踢鼓</div>
    <div class="drum-key k1" data-d="1">F<br>小鼓</div>
    <div class="drum-key k2" data-d="2">J<br>中鼓</div>
    <div class="drum-key k3" data-d="3">K<br>鈸</div>
  </div>
  <div id="startScreen" class="overlay">
    <h1>鼓點大師</h1>
    <p>鼓點從上方落下<br>在到達對應鼓面時敲擊！<br>鍵盤 D F J K 或點選下方鼓<br>跟著節奏打出完美鼓點</p>
    <button id="startBtn">開始搖滾</button>
  </div>
  <div id="endScreen" class="overlay hidden">
    <h2>表演結束</h2>
    <div class="stats">
      本局分數：<b id="finalScore">0</b><br>
      最高連擊：<b id="finalCombo">0</b><br>
      歷史最高：<b id="finalBest">0</b>
    </div>
    <button id="restartBtn">再來一場</button>
  </div>
</div>
<script>
const AC=window.AudioContext||window.webkitAudioContext;
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume()}
function playKick(){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.frequency.setValueAtTime(150,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(40,audioCtx.currentTime+.12);
  g.gain.setValueAtTime(.5,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.15);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.15);
}
function playSnare(){
  if(!audioCtx)return;
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*.2,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/2000);
  const src=audioCtx.createBufferSource(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();
  f.type='bandpass';f.frequency.value=2000;f.Q.value=1;
  src.buffer=buf;src.connect(f);f.connect(g);g.connect(audioCtx.destination);
  g.gain.setValueAtTime(.3,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.15);
  src.start();
}
function playTom(){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.frequency.setValueAtTime(200,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(80,audioCtx.currentTime+.15);
  g.gain.setValueAtTime(.35,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.18);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.18);
}
function playCymbal(){
  if(!audioCtx)return;
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*.3,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/3000);
  const src=audioCtx.createBufferSource(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();
  f.type='highpass';f.frequency.value=5000;
  src.buffer=buf;src.connect(f);f.connect(g);g.connect(audioCtx.destination);
  g.gain.setValueAtTime(.2,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.25);
  src.start();
}
const DRUM_FUNCS=[playKick,playSnare,playTom,playCymbal];
const game={score:0,combo:0,maxCombo:0,notes:[],running:false,speed:3.5,spawnTimer:0,spawnInterval:1.0,lastTime:0,missCount:0};
const pf=document.getElementById('playfield');
const judgeEl=document.getElementById('judge');
const scoreEl=document.getElementById('score');
const comboEl=document.getElementById('combo');
let best=0;
try{best=parseInt(localStorage.getItem('drumMaster_best')||'0')}catch(e){}
document.getElementById('best').textContent=best;

function showJudge(text,cls){judgeEl.textContent=text;judgeEl.className=cls;setTimeout(()=>judgeEl.className='',300);}

function spawnNote(){
  const d=Math.floor(Math.random()*4);
  const el=document.createElement('div');
  el.className='note d'+d;
  el.textContent=['K','S','T','C'][d];
  const hits=document.querySelectorAll('.drum-hit');
  const hitRect=hits[d].getBoundingClientRect();
  const pfRect=pf.getBoundingClientRect();
  el.style.left=(hitRect.left-pfRect.left+5)+'px';
  el.style.top='-60px';
  pf.appendChild(el);
  game.notes.push({el,drum:d,y:-60,hit:false});
}

function hitDrum(d){
  if(!game.running)return;
  initAudio();
  DRUM_FUNCS[d]();
  const key=document.querySelector('.drum-key[data-d="'+d+'"]');
  key.classList.add('active');setTimeout(()=>key.classList.remove('active'),100);
  const hit=document.querySelector('.drum-hit[data-d="'+d+'"]');
  hit.classList.add('active');setTimeout(()=>hit.classList.remove('active'),100);
  const pfH=pf.clientHeight;
  const hitY=pfH-130;
  let closest=null,closestDist=Infinity;
  for(const n of game.notes){
    if(n.drum===d&&!n.hit){
      const dist=Math.abs(n.y-hitY);
      if(dist<closestDist){closestDist=dist;closest=n;}
    }
  }
  if(closest&&closestDist<50){
    closest.hit=true;closest.el.remove();
    if(closestDist<20){game.score+=100;showJudge('PERFECT','perfect');}
    else{game.score+=50;showJudge('GOOD','good');}
    game.combo++;game.maxCombo=Math.max(game.maxCombo,game.combo);
    if(game.combo%10===0){game.speed=Math.min(7,game.speed+.3);game.spawnInterval=Math.max(.5,game.spawnInterval-.05);}
  }
  scoreEl.textContent=game.score;comboEl.textContent=game.combo;
}

function loop(t){
  if(!game.running)return;
  const dt=Math.min((t-game.lastTime)/1000,.05);
  game.lastTime=t;
  game.spawnTimer+=dt;
  if(game.spawnTimer>=game.spawnInterval){game.spawnTimer=0;spawnNote();}
  const pfH=pf.clientHeight;
  for(let i=game.notes.length-1;i>=0;i--){
    const n=game.notes[i];
    n.y+=game.speed*60*dt;
    n.el.style.top=n.y+'px';
    if(n.y>pfH-50&&!n.hit){
      n.hit=true;n.el.remove();
      game.combo=0;game.missCount++;
      showJudge('MISS','miss');
      scoreEl.textContent=game.score;comboEl.textContent=game.combo;
      if(game.missCount>=15){endGame();return;}
    }
  }
  game.notes=game.notes.filter(n=>!n.hit);
  requestAnimationFrame(loop);
}

function startGame(){
  initAudio();
  game.score=0;game.combo=0;game.maxCombo=0;game.notes.forEach(n=>n.el.remove());
  game.notes=[];game.speed=3.5;game.spawnTimer=0;game.spawnInterval=1.0;game.missCount=0;
  scoreEl.textContent=0;comboEl.textContent=0;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  game.running=true;game.lastTime=performance.now();
  requestAnimationFrame(loop);
}
function endGame(){
  game.running=false;
  game.notes.forEach(n=>n.el.remove());game.notes=[];
  if(game.score>best){best=game.score;try{localStorage.setItem('drumMaster_best',best)}catch(e){}}
  document.getElementById('best').textContent=best;
  document.getElementById('finalScore').textContent=game.score;
  document.getElementById('finalCombo').textContent=game.maxCombo;
  document.getElementById('finalBest').textContent=best;
  document.getElementById('endScreen').classList.remove('hidden');
}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('restartBtn').onclick=startGame;
document.querySelectorAll('.drum-key').forEach(k=>{
  k.addEventListener('pointerdown',e=>{e.preventDefault();hitDrum(parseInt(k.dataset.d));});
});
document.addEventListener('keydown',e=>{
  const map={'d':0,'f':1,'j':2,'k':3};
  if(map[e.key.toLowerCase()]!==undefined)hitDrum(map[e.key.toLowerCase()]);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.running)game.running=false;});
</script>
</body>
