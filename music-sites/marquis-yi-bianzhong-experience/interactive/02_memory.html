const I18N={
  zh:{title:'翻牌記憶遊戲',time:'時間',moves:'步數',pairs:'配對',restart:'重新開始',winTitle:'恭喜通關！',playAgain:'再玩一次',winDetail:'用時 {time}，共 {moves} 步完成！'},
  en:{title:'Memory Match',time:'Time',moves:'Moves',pairs:'Pairs',restart:'Restart',winTitle:'Congratulations!',playAgain:'Play Again',winDetail:'Completed in {time} with {moves} moves!'}
};
let lang='zh',cards=[],flipped=[],matched=0,moves=0,timerInterval=null,seconds=0,started=false;
function t(k){return I18N[lang][k]||k}
function toggleLang(){lang=lang==='zh'?'en':'zh';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelector('.lang-btn').textContent=lang==='zh'?'EN':'中'}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function initGame(){
  clearInterval(timerInterval);seconds=0;moves=0;matched=0;flipped=[];started=false;
  document.getElementById('timer').textContent='00:00';
  document.getElementById('moves').textContent='0';
  document.getElementById('winMsg').classList.remove('show');
  const pairs=SITE_CONFIG.memoryPairs;
  document.getElementById('pairs').textContent='0/'+pairs.length;
  cards=shuffle([...pairs,...pairs].map((p,i)=>({...p,id:i})));
  const board=document.getElementById('board');board.innerHTML='';
  cards.forEach((c,i)=>{
    const div=document.createElement('div');div.className='card-item';div.dataset.index=i;
    div.innerHTML='<div class="card-inner"><div class="card-face card-front"><i class="fas fa-question"></i></div><div class="card-face card-back">'+(lang==='zh'?c.text:c.textEn)+'</div></div>';
    div.onclick=()=>flipCard(div);board.appendChild(div);
  });
}
function startTimer(){if(started)return;started=true;timerInterval=setInterval(()=>{seconds++;const m=String(Math.floor(seconds/60)).padStart(2,'0');const s=String(seconds%60).padStart(2,'0');document.getElementById('timer').textContent=m+':'+s},1000)}
function flipCard(el){
  if(el.classList.contains('flipped')||el.classList.contains('matched')||flipped.length>=2)return;
  startTimer();
  el.classList.add('flipped');flipped.push(el);
  if(flipped.length===2){
    moves++;document.getElementById('moves').textContent=moves;
    const [a,b]=flipped;
    const ca=cards[a.dataset.index],cb=cards[b.dataset.index];
    if(ca.text===cb.text){
      setTimeout(()=>{a.classList.add('matched');b.classList.add('matched');matched++;document.getElementById('pairs').textContent=matched+'/'+SITE_CONFIG.memoryPairs.length;flipped=[];if(matched===SITE_CONFIG.memoryPairs.length)winGame()},500);
    }else{
      setTimeout(()=>{a.classList.remove('flipped');b.classList.remove('flipped');flipped=[]},900);
    }
  }
}
function winGame(){
  clearInterval(timerInterval);
  const m=String(Math.floor(seconds/60)).padStart(2,'0');const s=String(seconds%60).padStart(2,'0');
  document.getElementById('winDetail').textContent=t('winDetail').replace('{time}',m+':'+s).replace('{moves}',moves);
  document.getElementById('winMsg').classList.add('show');
}
initGame();
