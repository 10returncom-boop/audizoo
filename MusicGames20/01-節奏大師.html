<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;user-select:none;touch-action:none}
#game{position:relative;width:100%;max-width:500px;height:100%;display:flex;flex-direction:column}
#hud{display:flex;justify-content:space-between;padding:12px 16px;font-size:18px;z-index:10}
#hud span{font-weight:bold}
#score{color:#0ff}
#combo{color:#ff0}
#playfield{flex:1;position:relative;overflow:hidden}
.lane{position:absolute;top:0;bottom:0;width:25%;border-left:1px solid rgba(255,255,255,.1);border-right:1px solid rgba(255,255,255,.1)}
.lane:nth-child(1){left:0}
.lane:nth-child(2){left:25%}
.lane:nth-child(3){left:50%}
.lane:nth-child(4){left:75%}
.note{position:absolute;width:90%;left:5%;height:30px;border-radius:6px;transition:none}
.note.lane0{background:linear-gradient(180deg,#ff4466,#cc1133);box-shadow:0 0 15px #ff4466}
.note.lane1{background:linear-gradient(180deg,#44ff66,#11cc33);box-shadow:0 0 15px #44ff66}
.note.lane2{background:linear-gradient(180deg,#4488ff,#1155cc);box-shadow:0 0 15px #4488ff}
.note.lane3{background:linear-gradient(180deg,#ffaa44,#cc7711);box-shadow:0 0 15px #ffaa44}
#hitline{position:absolute;bottom:80px;left:0;right:0;height:4px;background:rgba(255,255,255,.3);z-index:5}
#keys{display:flex;height:80px}
.key{flex:1;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);transition:all .1s;cursor:pointer}
.key.active{background:rgba(255,255,255,.3);transform:scale(.95)}
.key.k0{color:#ff4466;border-color:#ff4466}
.key.k1{color:#44ff66;border-color:#44ff66}
.key.k2{color:#4488ff;border-color:#4488ff}
.key.k3{color:#ffaa44;border-color:#ffaa44}
#judge{position:absolute;top:40%;left:50%;transform:translateX(-50%);font-size:32px;font-weight:bold;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}
#judge.perfect{color:#0ff}
#judge.good{color:#0f0}
#judge.miss{color:#f44}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:20px}
.overlay h1{font-size:42px;background:linear-gradient(90deg,#0ff,#f0f);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.overlay p{font-size:18px;color:#aaa;text-align:center;line-height:1.6}
.overlay button{padding:14px 40px;font-size:20px;font-weight:bold;border:none;border-radius:30px;background:linear-gradient(90deg,#0ff,#f0f);color:#000;cursor:pointer;transition:transform .2s}
.overlay button:hover{transform:scale(1.05)}
.overlay .stats{font-size:20px;line-height:2}
.overlay .stats b{color:#0ff}
.hidden{display:none!important}
</style>

<body>
<div id="game">
  <div id="hud">
    <span>分數：<span id="score">0</span></span>
    <span>連擊：<span id="combo">0</span></span>
    <span>最高：<span id="best">0</span></span>
  </div>
  <div id="playfield">
    <div class="lane"></div><div class="lane"></div><div class="lane"></div><div class="lane"></div>
    <div id="hitline"></div>
    <div id="judge"></div>
  </div>
  <div id="keys">
    <div class="key k0" data-lane="0">D</div>
    <div class="key k1" data-lane="1">F</div>
    <div class="key k2" data-lane="2">J</div>
    <div class="key k3" data-lane="3">K</div>
  </div>
  <div id="startScreen" class="overlay">
    <h1>節奏大師</h1>
    <p>音符從上方落下<br>在到達判定線時按下對應按鍵<br>鍵盤 D F J K 或點選下方按鈕</p>
    <button id="startBtn">開始遊戲</button>
  </div>
  <div id="endScreen" class="overlay hidden">
    <h2>遊戲結束</h2>
    <div class="stats">
      本局分數：<b id="finalScore">0</b><br>
      最高連擊：<b id="finalCombo">0</b><br>
      歷史最高：<b id="finalBest">0</b>
    </div>
    <button id="restartBtn">再來一局</button>
  </div>
</div>
<script>
const AC = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio(){if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume()}
function playTone(freq,dur,type='sine',vol=.2){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+dur);
}
const NOTES=[261.63,329.63,392,523.25];
const game={score:0,combo:0,maxCombo:0,notes:[],running:false,paused:false,speed:3,spawnTimer:0,spawnInterval:1.2,lastTime:0,missCount:0};
const pf=document.getElementById('playfield');
const judgeEl=document.getElementById('judge');
const scoreEl=document.getElementById('score');
const comboEl=document.getElementById('combo');
const bestEl=document.getElementById('best');
let best=0;
try{best=parseInt(localStorage.getItem('rhythmMaster_best')||'0')}catch(e){}
bestEl.textContent=best;

function showJudge(text,cls){
  judgeEl.textContent=text;judgeEl.className=cls;judgeEl.style.opacity='1';
  setTimeout(()=>judgeEl.style.opacity='0',300);
}

function spawnNote(){
  const lane=Math.floor(Math.random()*4);
  const el=document.createElement('div');
  el.className='note lane'+lane;
  el.style.top='-30px';
  pf.appendChild(el);
  game.notes.push({el,lane,y:-30,hit:false});
}

function hitLane(lane){
  initAudio();
  const key=document.querySelector('.key[data-lane="'+lane+'"]');
  key.classList.add('active');
  setTimeout(()=>key.classList.remove('active'),100);
  const pfH=pf.clientHeight;
  const hitY=pfH-80;
  let closest=null,closestDist=Infinity;
  for(const n of game.notes){
    if(n.lane===lane&&!n.hit){
      const d=Math.abs(n.y-hitY);
      if(d<closestDist){closestDist=d;closest=n;}
    }
  }
  if(closest&&closestDist<50){
    closest.hit=true;
    closest.el.remove();
    if(closestDist<20){game.score+=100;showJudge('PERFECT','perfect');playTone(NOTES[lane],.15,'sine',.3);}
    else{game.score+=50;showJudge('GOOD','good');playTone(NOTES[lane],.12,'triangle',.2);}
    game.combo++;game.maxCombo=Math.max(game.maxCombo,game.combo);
    if(game.combo%10===0){game.speed=Math.min(8,game.speed+.3);game.spawnInterval=Math.max(.5,game.spawnInterval-.05);}
  }else{
    playTone(150,.1,'sawtooth',.1);
  }
  updateHUD();
}

function updateHUD(){scoreEl.textContent=game.score;comboEl.textContent=game.combo;}

function loop(t){
  if(!game.running)return;
  const dt=Math.min((t-game.lastTime)/1000,.05);
  game.lastTime=t;
  game.spawnTimer+=dt;
  if(game.spawnTimer>=game.spawnInterval){game.spawnTimer=0;spawnNote();}
  const pfH=pf.clientHeight;
  for(let i=game.notes.length-1;i>=0;i--){
    const n=game.notes[i];
    n.y+=game.speed*60*dt;
    n.el.style.top=n.y+'px';
    if(n.y>pfH-30&&!n.hit){
      n.hit=true;n.el.remove();
      game.combo=0;game.missCount++;
      showJudge('MISS','miss');playTone(100,.2,'sawtooth',.15);
      updateHUD();
      if(game.missCount>=20){endGame();return;}
    }
  }
  game.notes=game.notes.filter(n=>!n.hit);
  requestAnimationFrame(loop);
}

function startGame(){
  initAudio();
  game.score=0;game.combo=0;game.maxCombo=0;game.notes.forEach(n=>n.el.remove());
  game.notes=[];game.speed=3;game.spawnTimer=0;game.spawnInterval=1.2;game.missCount=0;
  updateHUD();
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  game.running=true;game.lastTime=performance.now();
  requestAnimationFrame(loop);
}

function endGame(){
  game.running=false;
  game.notes.forEach(n=>n.el.remove());game.notes=[];
  if(game.score>best){best=game.score;try{localStorage.setItem('rhythmMaster_best',best)}catch(e){}}
  bestEl.textContent=best;
  document.getElementById('finalScore').textContent=game.score;
  document.getElementById('finalCombo').textContent=game.maxCombo;
  document.getElementById('finalBest').textContent=best;
  document.getElementById('endScreen').classList.remove('hidden');
}

document.getElementById('startBtn').onclick=startGame;
document.getElementById('restartBtn').onclick=startGame;
document.querySelectorAll('.key').forEach(k=>{
  k.addEventListener('pointerdown',e=>{e.preventDefault();hitLane(parseInt(k.dataset.lane));});
});
document.addEventListener('keydown',e=>{
  if(!game.running)return;
  const map={'d':0,'f':1,'j':2,'k':3};
  if(map[e.key.toLowerCase()]!==undefined)hitLane(map[e.key.toLowerCase()]);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.running){game.running=false;}});
</script>
</body>
