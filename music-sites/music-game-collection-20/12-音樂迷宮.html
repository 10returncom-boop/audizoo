<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;user-select:none;touch-action:none}
#game{position:relative;width:100%;max-width:500px;height:100%;display:flex;flex-direction:column;align-items:center;padding:10px;gap:10px}
#hud{display:flex;justify-content:space-between;width:100%;font-size:16px;max-width:400px}
#level{color:#0ff;font-weight:bold}
#score{color:#ff0;font-weight:bold}
#best{color:#f80;font-weight:bold}
canvas{background:#0d0d2b;border:2px solid #333;border-radius:8px;display:block}
#dpad{display:grid;grid-template-columns:repeat(3,55px);grid-template-rows:repeat(3,55px);gap:5px;margin-top:5px}
.dp-btn{display:flex;align-items:center;justify-content:center;background:#1a1a3e;border:2px solid #444;border-radius:10px;font-size:22px;cursor:pointer;transition:all .1s;color:#fff}
.dp-btn:active{background:#333;border-color:#0ff;transform:scale(.95)}
.dp-empty{visibility:hidden}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:20px;padding:20px}
.overlay h1{font-size:36px;background:linear-gradient(90deg,#0ff,#f0f);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.overlay p{font-size:15px;color:#aaa;text-align:center;line-height:1.8;max-width:350px}
.overlay button{padding:14px 40px;font-size:20px;font-weight:bold;border:none;border-radius:30px;background:linear-gradient(90deg,#0ff,#f0f);color:#000;cursor:pointer}
.overlay .stats{font-size:18px;line-height:2;text-align:center}
.overlay .stats b{color:#0ff}
.hidden{display:none!important}

<body>
<div id="game">
  <div id="hud">
    <span>關卡：<span id="level">1</span></span>
    <span>分數：<span id="score">0</span></span>
    <span>最高：<span id="best">0</span></span>
  </div>
  <canvas id="cv" width="400" height="400"></canvas>
  <div id="dpad">
    <div class="dp-empty"></div>
    <div class="dp-btn" data-dir="up">↑</div>
    <div class="dp-empty"></div>
    <div class="dp-btn" data-dir="left">←</div>
    <div class="dp-btn" data-dir="down">↓</div>
    <div class="dp-btn" data-dir="right">→</div>
  </div>
  <div id="startScreen" class="overlay">
    <h1>音樂迷宮</h1>
    <p>在迷宮中收集所有金色音符，到達綠色終點！<br>每收集一個音符就會彈出美妙的音階<br>鍵盤方向鍵或下方按鈕移動<br>收集全部音符才能通關！</p>
    <button id="startBtn">開始探索</button>
  </div>
  <div id="winScreen" class="overlay hidden">
    <h2>過關！</h2>
    <div class="stats">
      當前關卡：<b id="winLevel">1</b><br>
      累計分數：<b id="winScore">0</b>
    </div>
    <button id="nextBtn">下一關</button>
  </div>
  <div id="endScreen" class="overlay hidden">
    <h2>遊戲結束</h2>
    <div class="stats">
      到達關卡：<b id="finalLevel">1</b><br>
      最終分數：<b id="finalScore">0</b><br>
      歷史最高：<b id="finalBest">0</b>
    </div>
    <button id="restartBtn">再來一局</button>
  </div>
</div>
<script>
const AC=window.AudioContext||window.webkitAudioContext;
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume()}
function playNote(freq,dur=.3,type='sine',vol=.2){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
}
const SCALE=[261.63,293.66,329.63,349.23,392,440,493.88,523.25,587.33,659.25];
const cv=document.getElementById('cv');const ctx=cv.getContext('2d');
const TILE=40,GRID=10;
const game={level:1,score:0,maze:[],player:{x:1,y:1},notes:[],goal:{x:8,y:8},collected:0,totalNotes:0,running:false,noteIdx:0};
const levelEl=document.getElementById('level');
const scoreEl=document.getElementById('score');
let best=0;
try{best=parseInt(localStorage.getItem('musicMaze_best')||'0')}catch(e){}
document.getElementById('best').textContent=best;

function genMaze(){
  const size=GRID;
  const m=Array.from({length:size},()=>Array(size).fill(1));
  function carve(x,y){
    m[y][x]=0;
    const dirs=[[0,-2],[0,2],[-2,0],[2,0]].sort(()=>Math.random()-.5);
    for(const [dx,dy] of dirs){
      const nx=x+dx,ny=y+dy;
      if(nx>0&&nx<size-1&&ny>0&&ny<size-1&&m[ny][nx]===1){
        m[y+dy/2][x+dx/2]=0;
        carve(nx,ny);
      }
    }
  }
  carve(1,1);
  return m;
}
function placeNotes(){
  game.notes=[];
  const count=3+game.level;
  const open=[];
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++)
    if(game.maze[y][x]===0&&!(x===1&&y===1)&&!(x===game.goal.x&&y===game.goal.y))open.push({x,y});
  open.sort(()=>Math.random()-.5);
  for(let i=0;i<Math.min(count,open.length);i++)game.notes.push({...open[i],collected:false});
  game.totalNotes=game.notes.length;
  game.collected=0;
}
function initLevel(){
  game.maze=genMaze();
  game.player={x:1,y:1};
  game.goal={x:GRID-2,y:GRID-2};
  game.maze[game.goal.y][game.goal.x]=0;
  placeNotes();
  game.noteIdx=0;
  levelEl.textContent=game.level;
}
function draw(){
  ctx.fillStyle='#0d0d2b';ctx.fillRect(0,0,cv.width,cv.height);
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    if(game.maze[y][x]===1){
      ctx.fillStyle='#2a2a5e';
      ctx.fillRect(x*TILE,y*TILE,TILE-1,TILE-1);
      ctx.fillStyle='#3a3a7e';
      ctx.fillRect(x*TILE,y*TILE,TILE-1,3);
    }
  }
  const allCollected=game.collected>=game.totalNotes;
  ctx.fillStyle=allCollected?'#0f0':'#064';
  ctx.shadowColor=allCollected?'#0f0':'#064';
  ctx.shadowBlur=allCollected?15:0;
  ctx.fillRect(game.goal.x*TILE+5,game.goal.y*TILE+5,TILE-10,TILE-10);
  ctx.shadowBlur=0;
  for(const n of game.notes){
    if(n.collected)continue;
    ctx.save();ctx.translate(n.x*TILE+TILE/2,n.y*TILE+TILE/2);
    ctx.fillStyle='#ff0';ctx.shadowColor='#ff0';ctx.shadowBlur=12;
    ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('♪',0,1);
    ctx.restore();
  }
  ctx.save();ctx.translate(game.player.x*TILE+TILE/2,game.player.y*TILE+TILE/2);
  ctx.fillStyle='#0ff';ctx.shadowColor='#0ff';ctx.shadowBlur=15;
  ctx.beginPath();ctx.arc(0,0,TILE/3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-4,-3,3,0,Math.PI*2);ctx.arc(4,-3,3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function move(dx,dy){
  if(!game.running)return;
  initAudio();
  const nx=game.player.x+dx,ny=game.player.y+dy;
  if(nx<0||nx>=GRID||ny<0||ny>=GRID||game.maze[ny][nx]===1)return;
  game.player.x=nx;game.player.y=ny;
  playNote(200+Math.random()*100,.08,'square',.08);
  for(const n of game.notes){
    if(!n.collected&&n.x===nx&&n.y===ny){
      n.collected=true;game.collected++;game.score+=100;
      playNote(SCALE[game.noteIdx%SCALE.length],.4,'sine',.25);
      game.noteIdx++;
      scoreEl.textContent=game.score;
    }
  }
  if(nx===game.goal.x&&ny===game.goal.y&&game.collected>=game.totalNotes){
    game.score+=500;scoreEl.textContent=game.score;
    playNote(1046,.5,'sine',.3);
    winLevel();
    return;
  }
  draw();
}
function winLevel(){
  game.running=false;
  document.getElementById('winLevel').textContent=game.level;
  document.getElementById('winScore').textContent=game.score;
  document.getElementById('winScreen').classList.remove('hidden');
}
function nextLevel(){
  game.level++;
  document.getElementById('winScreen').classList.add('hidden');
  initLevel();draw();
  game.running=true;
}
function startGame(){
  initAudio();
  game.level=1;game.score=0;
  scoreEl.textContent=0;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('winScreen').classList.add('hidden');
  initLevel();draw();
  game.running=true;
}
function endGame(){
  game.running=false;
  if(game.score>best){best=game.score;try{localStorage.setItem('musicMaze_best',best)}catch(e){}}
  document.getElementById('best').textContent=best;
  document.getElementById('finalLevel').textContent=game.level;
  document.getElementById('finalScore').textContent=game.score;
  document.getElementById('finalBest').textContent=best;
  document.getElementById('endScreen').classList.remove('hidden');
}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('restartBtn').onclick=startGame;
document.getElementById('nextBtn').onclick=nextLevel;
document.querySelectorAll('.dp-btn').forEach(b=>b.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const d=b.dataset.dir;
  if(d==='up')move(0,-1);
  if(d==='down')move(0,1);
  if(d==='left')move(-1,0);
  if(d==='right')move(1,0);
}));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'){e.preventDefault();move(0,-1);}
  if(e.key==='ArrowDown'){e.preventDefault();move(0,1);}
  if(e.key==='ArrowLeft'){e.preventDefault();move(-1,0);}
  if(e.key==='ArrowRight'){e.preventDefault();move(1,0);}
});
</script>
</body>
