.footer{text-align:center;padding:1.5rem;color:var(--muted);font-size:.85rem;border-top:1px solid var(--border);background:var(--card)}

const I18N={
  zh:{title:'點擊探索熱區',found:'已探索',hint:'點擊地圖上的閃亮圓點探索各個熱區'},
  en:{title:'Explore Hotspots',found:'Explored',hint:'Click the glowing dots on the map to explore each hotspot'}
};
let lang='zh',foundSet=new Set();
function t(k){return I18N[lang][k]||k}
function toggleLang(){lang=lang==='zh'?'en':'zh';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelector('.lang-btn').textContent=lang==='zh'?'EN':'中';renderHotspots()}
function renderHotspots(){
  const map=document.getElementById('mapContainer');
  map.querySelectorAll('.hotspot').forEach(h=>h.remove());
  document.getElementById('totalCount').textContent=SITE_CONFIG.hotspots.length;
  SITE_CONFIG.hotspots.forEach((hs,i)=>{
    const dot=document.createElement('div');
    dot.className='hotspot'+(foundSet.has(i)?' found':'');
    dot.style.left=hs.x+'%';dot.style.top=hs.y+'%';
    dot.innerHTML='<i class="fas '+(hs.icon||'fa-star')+'"></i>';
    dot.onclick=()=>showInfo(i,dot);
    map.appendChild(dot);
  });
}
function showInfo(idx,dot){
  foundSet.add(idx);dot.classList.add('found');
  document.getElementById('foundCount').textContent=foundSet.size;
  const hs=SITE_CONFIG.hotspots[idx];
  const panel=document.getElementById('infoPanel');
  panel.classList.remove('empty');
  panel.innerHTML='<span class="info-tag">'+(lang==='zh'?hs.tag:hs.tagEn)+'</span><h3 class="info-title">'+(lang==='zh'?hs.title:hs.titleEn)+'</h3><p class="info-desc">'+(lang==='zh'?hs.description:hs.descriptionEn)+'</p>';
}
renderHotspots();
</script>
