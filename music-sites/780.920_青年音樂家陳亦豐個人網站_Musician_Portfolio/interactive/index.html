<style>
:root{--primary:#6366f1;--accent:#f59e0b;--bg:#f8f9fc;--card:#fff;--text:#1a1a2e;--muted:#6b7280;--border:#e5e7eb;--radius:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;padding:1.2rem 1.5rem;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.header h1{font-size:1.3rem;display:flex;align-items:center;gap:.5rem}
.lang-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:.4rem .9rem;border-radius:20px;cursor:pointer;font-size:.85rem}
.lang-btn:hover{background:rgba(255,255,255,.35)}
.hero{text-align:center;padding:2.5rem 1rem 1.5rem;background:linear-gradient(180deg,rgba(0,0,0,.03),transparent)}
.hero h2{font-size:1.6rem;color:var(--primary);margin-bottom:.5rem}
.hero p{color:var(--muted);font-size:.95rem}
.hero .site-badge{display:inline-block;background:var(--primary);color:#fff;padding:.3rem 1rem;border-radius:20px;font-size:.8rem;margin-bottom:.8rem}
.main{flex:1;max-width:1000px;width:100%;margin:0 auto;padding:1rem 1rem 2rem}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.2rem}
.game-card{background:var(--card);border-radius:var(--radius);padding:1.5rem;text-decoration:none;color:var(--text);box-shadow:0 4px 16px rgba(0,0,0,.06);transition:.25s;position:relative;overflow:hidden;display:block}
.game-card:hover{transform:translateY(-4px);box-shadow:0 8px 28px rgba(0,0,0,.12)}
.game-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--primary),var(--accent))}
.game-icon{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.5rem;margin-bottom:1rem}
.game-num{position:absolute;top:1rem;right:1.2rem;font-size:2rem;font-weight:900;color:rgba(0,0,0,.06)}
.game-title{font-size:1.1rem;font-weight:700;margin-bottom:.4rem;color:var(--text)}
.game-desc{font-size:.85rem;color:var(--muted);line-height:1.5;margin-bottom:1rem}
.game-arrow{color:var(--primary);font-size:.9rem;opacity:.7}
.game-card:hover .game-arrow{opacity:1}
.footer{text-align:center;padding:1.5rem;color:var(--muted);font-size:.85rem;border-top:1px solid var(--border);background:var(--card)}
.footer a{color:var(--primary);text-decoration:none}
.back-link{display:inline-flex;align-items:center;gap:.4rem;color:#fff;text-decoration:none;font-size:.85rem;opacity:.9;margin-top:.3rem}
.back-link:hover{opacity:1}
@media(max-width:480px){.games-grid{grid-template-columns:1fr}.hero h2{font-size:1.3rem}.main{padding:1rem .8rem}}
</style>

<script>
let lang='zh';
function toggleLang(){
  lang=lang==='zh'?'en':'zh';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    el.textContent=lang==='zh'?el.dataset.zh:el.dataset.en;
  });
  document.querySelector('.lang-btn').textContent=lang==='zh'?'EN':'中';
}
