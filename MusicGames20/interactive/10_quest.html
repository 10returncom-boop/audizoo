const I18N={
  zh:{title:'闖關解謎小遊戲',level:'第',check:'確認答案',next:'下一關',restart:'再玩一次',correct:'答對了！',wrong:'答錯了，再試試！',scrambled:'字母打亂了，請排出正確的字',sortHint:'拖曳排列正確順序',riddleHint:'請選擇正確答案',allDone:'全部通關！',finalMsg:'你成功解開了所有謎題！'},
  en:{title:'Puzzle Quest',level:'Level',check:'Check Answer',next:'Next Level',restart:'Play Again',correct:'Correct!',wrong:'Wrong, try again!',scrambled:'Unscramble the letters',sortHint:'Drag to arrange in correct order',riddleHint:'Choose the correct answer',allDone:'All Cleared!',finalMsg:'You solved all puzzles!'}
};
let lang='zh',currentLevel=0,attempts=0;
function t(k){return I18N[lang][k]||k}
function toggleLang(){lang=lang==='zh'?'en':'zh';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelector('.lang-btn').textContent=lang==='zh'?'EN':'中';currentLevel=0;renderLevel()}
function updateIndicator(){
  const ind=document.getElementById('levelIndicator');ind.innerHTML='';
  SITE_CONFIG.questLevels.forEach((_,i)=>{
    const dot=document.createElement('div');
    dot.className='level-dot'+(i<currentLevel?' done':i===currentLevel?' active':'');
    ind.appendChild(dot);
  });
}
function renderLevel(){
  updateIndicator();
  const card=document.getElementById('gameCard');
  if(currentLevel>=SITE_CONFIG.questLevels.length){renderFinal();return}
  const lv=SITE_CONFIG.questLevels[currentLevel];
  let body='';
  if(lv.type==='scramble'){
    body='<p class="level-desc">'+t('scrambled')+'</p><div class="scramble-word" id="scrambleWord">'+lv.scrambled+'</div><input type="text" class="scramble-input" id="scrambleInput" placeholder="..." autocomplete="off"><div class="feedback" id="feedback"></div><button class="btn" onclick="checkScramble()">'+t('check')+'</button>';
  }else if(lv.type==='sort'){
    const items=shuffle([...lv.items]);
    body='<p class="level-desc">'+t('sortHint')+'</p><div class="sort-list" id="sortList">'+items.map((it,i)=>'<div class="sort-item" draggable="true" data-val="'+it+'"><span class="order-num">'+(i+1)+'</span><i class="fas fa-grip-vertical drag-handle"></i><span>'+it+'</span></div>').join('')+'</div><div class="feedback" id="feedback"></div><button class="btn" onclick="checkSort()">'+t('check')+'</button>';
    setupDrag();
  }else if(lv.type==='riddle'){
    body='<div class="riddle-text">'+(lang==='zh'?lv.question:lv.questionEn)+'</div><div class="riddle-options" id="riddleOpts">'+(lang==='zh'?lv.options:lv.optionsEn).map((o,i)=>'<button class="riddle-opt" onclick="checkRiddle('+i+',this)">'+o+'</button>').join('')+'</div><div class="feedback" id="feedback"></div>';
  }
  card.innerHTML='<span class="level-badge">'+t('level')+' '+(currentLevel+1)+' / '+SITE_CONFIG.questLevels.length+'</span><h2 class="level-title">'+(lang==='zh'?lv.title:lv.titleEn)+'</h2>'+body;
}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function setupDrag(){
  const list=document.getElementById('sortList');if(!list)return;
  let dragEl=null;
  list.querySelectorAll('.sort-item').forEach(item=>{
    item.addEventListener('dragstart',e=>{dragEl=item;item.classList.add('dragging')});
    item.addEventListener('dragend',()=>{item.classList.remove('dragging');updateOrderNums()});
    item.addEventListener('dragover',e=>{e.preventDefault();const rect=item.getBoundingClientRect();const after=e.clientY>rect.top+rect.height/2;if(dragEl&&dragEl!==item){if(after){item.after(dragEl)}else{item.before(dragEl)}}});
  });
}
function updateOrderNums(){
  document.querySelectorAll('#sortList .sort-item').forEach((it,i)=>{it.querySelector('.order-num').textContent=i+1});
}
function showFeedback(el,msg,isOk){el.textContent=msg;el.className='feedback show '+(isOk?'success':'error')}
function checkScramble(){
  const lv=SITE_CONFIG.questLevels[currentLevel];
  const input=document.getElementById('scrambleInput').value.trim().toLowerCase();
  const fb=document.getElementById('feedback');
  if(input===lv.answer.toLowerCase()){showFeedback(fb,t('correct'),true);setTimeout(nextLevel,800)}
  else{showFeedback(fb,t('wrong'),false)}
}
function checkSort(){
  const lv=SITE_CONFIG.questLevels[currentLevel];
  const current=Array.from(document.querySelectorAll('#sortList .sort-item')).map(el=>el.dataset.val);
  const fb=document.getElementById('feedback');
  if(JSON.stringify(current)===JSON.stringify(lv.items)){showFeedback(fb,t('correct'),true);setTimeout(nextLevel,800)}
  else{showFeedback(fb,t('wrong'),false)}
}
function checkRiddle(idx,btn){
  const lv=SITE_CONFIG.questLevels[currentLevel];
  const fb=document.getElementById('feedback');
  document.querySelectorAll('.riddle-opt').forEach((b,i)=>{
    if(i===lv.answer)b.classList.add('correct');
    if(i===idx&&idx!==lv.answer)b.classList.add('wrong');
  });
  if(idx===lv.answer){showFeedback(fb,t('correct'),true);setTimeout(nextLevel,800)}
  else{showFeedback(fb,t('wrong'),false)}
}
function nextLevel(){currentLevel++;renderLevel()}
function renderFinal(){
  updateIndicator();
  document.getElementById('gameCard').innerHTML='<div class="final-screen"><i class="fas fa-trophy"></i><div class="stars"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i></div><h2>'+t('allDone')+'</h2><p>'+t('finalMsg')+'</p><button class="btn" onclick="currentLevel=0;renderLevel()">'+t('restart')+'</button></div>';
}
renderLevel();
