<body>
<div id="game">
  <div id="hud">
    <span>分數：<span id="score">0</span></span>
    <span>最高：<span id="best">0</span></span>
  </div>
  <canvas id="cv"></canvas>
  <div id="startScreen" class="overlay">
    <h1>音樂跳球</h1>
    <p>點選螢幕讓球跳躍<br>避開紅色障礙，收集金色音符<br>隨著音樂節奏前進！</p>
    <button id="startBtn">開始遊戲</button>
  </div>
  <div id="endScreen" class="overlay hidden">
    <h2>遊戲結束</h2>
    <div class="stats">
      本局分數：<b id="finalScore">0</b><br>
      歷史最高：<b id="finalBest">0</b>
    </div>
    <button id="restartBtn">再來一局</button>
  </div>
</div>
<script>
const AC=window.AudioContext||window.webkitAudioContext;
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume()}
function playTone(freq,dur,type='sine',vol=.2){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+dur);
}
const MELODY=[261.63,293.66,329.63,392,440,523.25,440,392];
let melodyIdx=0;
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let W,H;
function resize(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);}
window.addEventListener('resize',resize);
const game={score:0,ball:{x:80,y:0,vy:0,r:18},obstacles:[],notes:[],speed:3,gravity:.5,jump:-10,running:false,lastTime:0,groundY:0,beatTimer:0,particles:[]};
const scoreEl=document.getElementById('score');
let best=0;
try{best=parseInt(localStorage.getItem('musicJump_best')||'0')}catch(e){}
document.getElementById('best').textContent=best;

function jump(){
  if(!game.running)return;
  initAudio();
  if(game.ball.y>=game.groundY-game.ball.r-1){
    game.ball.vy=game.jump;
    playTone(MELODY[melodyIdx%MELODY.length],.12,'sine',.25);
    melodyIdx++;
  }
}

function spawnObstacle(){
  const h=30+Math.random()*40;
  game.obstacles.push({x:W+20,y:game.groundY-h,w:25,h:h,passed:false});
}
function spawnNote(){
  game.notes.push({x:W+20,y:game.groundY-80-Math.random()*100,r:12,collected:false});
}

function addParticles(x,y,color){
  for(let i=0;i<8;i++){
    game.particles.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:1,color});
  }
}

function loop(t){
  if(!game.running)return;
  const dt=Math.min((t-game.lastTime)/1000,.05)*60;
  game.lastTime=t;
  game.beatTimer+=dt;
  if(game.beatTimer>60){game.beatTimer=0;if(Math.random()<.7)spawnObstacle();if(Math.random()<.5)spawnNote();}
  game.ball.vy+=game.gravity*dt;
  game.ball.y+=game.ball.vy*dt;
  if(game.ball.y>game.groundY-game.ball.r){game.ball.y=game.groundY-game.ball.r;game.ball.vy=0;}
  for(const o of game.obstacles){
    o.x-=game.speed*dt;
    if(!o.passed&&o.x+o.w<game.ball.x){o.passed=true;game.score+=10;scoreEl.textContent=game.score;}
    if(game.ball.x+game.ball.r>o.x&&game.ball.x-game.ball.r<o.x+o.w&&
       game.ball.y+game.ball.r>o.y&&game.ball.y-game.ball.r<o.y+o.h){
      playTone(80,.3,'sawtooth',.3);endGame();return;
    }
  }
  for(const n of game.notes){
    n.x-=game.speed*dt;
    if(!n.collected){
      const dx=game.ball.x-n.x,dy=game.ball.y-n.y;
      if(dx*dx+dy*dy<(game.ball.r+n.r)*(game.ball.r+n.r)){
        n.collected=true;game.score+=50;scoreEl.textContent=game.score;
        playTone(880,.15,'sine',.3);addParticles(n.x,n.y,'#ff0');
      }
    }
  }
  game.obstacles=game.obstacles.filter(o=>o.x+o.w>-10);
  game.notes=game.notes.filter(n=>!n.collected&&n.x>-20);
  for(const p of game.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=.03*dt;}
  game.particles=game.particles.filter(p=>p.life>0);
  if(game.score%100===0&&game.score>0)game.speed=Math.min(7,game.speed+.02);
  ctx.clearRect(0,0,W,H);
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0d0d2b');grad.addColorStop(1,'#1a1a4e');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#2a2a5e';ctx.fillRect(0,game.groundY,W,H-game.groundY);
  ctx.strokeStyle='#f0f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,game.groundY);ctx.lineTo(W,game.groundY);ctx.stroke();
  for(const o of game.obstacles){
    ctx.fillStyle='#f44';ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.fillStyle='#ff6666';ctx.fillRect(o.x+3,o.y+3,o.w-6,5);
  }
  for(const n of game.notes){
    if(n.collected)continue;
    ctx.save();ctx.translate(n.x,n.y);
    ctx.fillStyle='#ff0';ctx.shadowColor='#ff0';ctx.shadowBlur=15;
    ctx.beginPath();ctx.arc(0,0,n.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('♪',0,1);
    ctx.restore();
  }
  for(const p of game.particles){
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(game.ball.x,game.ball.y);
  const bg=ctx.createRadialGradient(-5,-5,2,0,0,game.ball.r);
  bg.addColorStop(0,'#fff');bg.addColorStop(.5,'#f0f');bg.addColorStop(1,'#a0f');
  ctx.fillStyle=bg;ctx.shadowColor='#f0f';ctx.shadowBlur=20;
  ctx.beginPath();ctx.arc(0,0,game.ball.r,0,Math.PI*2);ctx.fill();
  ctx.restore();
  requestAnimationFrame(loop);
}

function startGame(){
  initAudio();resize();
  game.groundY=H-60;
  game.score=0;game.ball.x=80;game.ball.y=game.groundY-20;game.ball.vy=0;
  game.obstacles=[];game.notes=[];game.particles=[];game.speed=3;game.beatTimer=0;melodyIdx=0;
  scoreEl.textContent=0;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  game.running=true;game.lastTime=performance.now();
  requestAnimationFrame(loop);
}

function endGame(){
  game.running=false;
  if(game.score>best){best=game.score;try{localStorage.setItem('musicJump_best',best)}catch(e){}}
  document.getElementById('best').textContent=best;
  document.getElementById('finalScore').textContent=game.score;
  document.getElementById('finalBest').textContent=best;
  document.getElementById('endScreen').classList.remove('hidden');
}

document.getElementById('startBtn').onclick=startGame;
document.getElementById('restartBtn').onclick=startGame;
cv.addEventListener('pointerdown',e=>{e.preventDefault();jump();});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.running)game.running=false;});
resize();
</script>
