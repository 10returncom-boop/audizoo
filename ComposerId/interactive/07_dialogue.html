const I18N={
  zh:{title:'角色對話模擬器',restart:'重新對話'},
  en:{title:'Dialogue Simulator',restart:'Restart'}
};
let lang='zh',currentNode='start';
function t(k){return I18N[lang][k]||k}
function toggleLang(){lang=lang==='zh'?'en':'zh';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelector('.lang-btn').textContent=lang==='zh'?'EN':'中';startDialogue()}
function addMsg(text,isPlayer){
  const msgs=document.getElementById('messages');
  const div=document.createElement('div');
  div.className='msg '+(isPlayer?'player':'npc');
  div.textContent=text;
  msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;
}
function showChoices(node){
  const container=document.getElementById('choices');container.innerHTML='';
  const tree=SITE_CONFIG.dialogueTree;
  const data=tree[node];
  if(!data||!data.choices||data.choices.length===0){
    document.getElementById('restartArea').style.display='block';
    return;
  }
  document.getElementById('restartArea').style.display='none';
  data.choices.forEach(ch=>{
    const btn=document.createElement('button');
    btn.className='choice-btn';
    btn.innerHTML='<i class="fas fa-caret-right"></i>'+(lang==='zh'?ch.text:ch.textEn);
    btn.onclick=()=>{
      addMsg(lang==='zh'?ch.text:ch.textEn,true);
      container.innerHTML='';
      const typing=document.createElement('div');typing.className='msg npc typing';
      typing.innerHTML='<span></span><span></span><span></span>';
      document.getElementById('messages').appendChild(typing);
      document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight;
      setTimeout(()=>{typing.remove();const next=tree[ch.next];if(next){addMsg(lang==='zh'?next.npc:next.npcEn,false);showChoices(ch.next)}},800);
    };
    container.appendChild(btn);
  });
}
function startDialogue(){
  document.getElementById('messages').innerHTML='';
  document.getElementById('restartArea').style.display='none';
  const tree=SITE_CONFIG.dialogueTree;
  const start=tree.start;
  document.getElementById('charName').textContent=lang==='zh'?start.character:start.characterEn;
  document.getElementById('charDesc').textContent=lang==='zh'?start.desc:start.descEn;
  currentNode='start';
  setTimeout(()=>{addMsg(lang==='zh'?start.npc:start.npcEn,false);showChoices('start')},400);
}
startDialogue();
