const I18N={
  zh:{title:'隨機籤詩抽取',draw:'抽一支籤',drawn:'已抽',times:'次',meaningLabel:'籤意解讀：'},
  en:{title:'Fortune Drawing',draw:'Draw a Fortune',drawn:'Drawn',times:'times',meaningLabel:'Interpretation:'}
};
let lang='zh',drawCount=0;
function t(k){return I18N[lang][k]||k}
function toggleLang(){lang=lang==='zh'?'en':'zh';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelector('.lang-btn').textContent=lang==='zh'?'EN':'中'}
function drawFortune(){
  const btn=document.getElementById('drawBtn');
  const stick=document.getElementById('stick');
  btn.disabled=true;
  stick.classList.add('shaking');
  document.getElementById('fortuneCard').classList.remove('show');
  setTimeout(()=>{
    stick.classList.remove('shaking');
    stick.classList.add('pulled');
    setTimeout(()=>{
      stick.classList.remove('pulled');
      const f=SITE_CONFIG.fortunes[Math.floor(Math.random()*SITE_CONFIG.fortunes.length)];
      document.getElementById('fortuneLevel').textContent=lang==='zh'?f.level:f.levelEn;
      document.getElementById('fortuneLevel').className='fortune-level '+(lang==='zh'?f.level:f.levelEn);
      document.getElementById('fortuneQuote').textContent=lang==='zh'?f.quote:f.quoteEn;
      document.getElementById('fortuneSource').textContent='— '+(lang==='zh'?f.source:f.sourceEn);
      document.getElementById('fortuneMeaning').innerHTML='<strong>'+t('meaningLabel')+'</strong>'+(lang==='zh'?f.meaning:f.meaningEn);
      document.getElementById('fortuneCard').classList.add('show');
      drawCount++;document.getElementById('drawCount').textContent=drawCount;
      btn.disabled=false;
    },800);
  },1500);
}
