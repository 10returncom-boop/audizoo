<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;touch-action:none}
#game{position:relative;width:100%;max-width:450px;display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px}
#hud{display:flex;justify-content:space-between;width:100%;font-size:18px}
#level{color:#0ff;font-weight:bold}
#score{color:#ff0;font-weight:bold}
#best{color:#f80;font-weight:bold}
#status{font-size:20px;text-align:center;min-height:30px;color:#aaa}
#board{width:320px;height:320px;position:relative;border-radius:50%;background:#111;padding:10px;box-shadow:0 0 40px rgba(0,0,0,.5)}
.pad{position:absolute;width:140px;height:140px;cursor:pointer;transition:all .1s;opacity:.6}
.pad.active{opacity:1;transform:scale(.95)}
.pad.p0{top:10px;left:10px;background:radial-gradient(circle at 30% 30%,#44ff66,#119922);border-radius:140px 10px 10px 10px}
.pad.p1{top:10px;right:10px;background:radial-gradient(circle at 70% 30%,#ff4466,#991122);border-radius:10px 140px 10px 10px}
.pad.p2{bottom:10px;left:10px;background:radial-gradient(circle at 30% 70%,#ffaa44,#996611);border-radius:10px 10px 10px 140px}
.pad.p3{bottom:10px;right:10px;background:radial-gradient(circle at 70% 70%,#4488ff,#114499);border-radius:10px 10px 140px 10px}
#center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;border-radius:50%;background:#1a1a2e;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;color:#666;border:3px solid #333;z-index:5}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:20px;padding:20px}
.overlay h1{font-size:38px;background:linear-gradient(90deg,#0ff,#f0f);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.overlay p{font-size:16px;color:#aaa;text-align:center;line-height:1.8;max-width:350px}
.overlay button{padding:14px 40px;font-size:20px;font-weight:bold;border:none;border-radius:30px;background:linear-gradient(90deg,#0ff,#f0f);color:#000;cursor:pointer}
.overlay .stats{font-size:20px;line-height:2;text-align:center}
.overlay .stats b{color:#0ff}
.hidden{display:none!important}
</style>
<!-- ANTI-COPY-PROTECT -->
<style>

  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;

  -webkit-touch-callout: none;
}

  body { display: none !important; }
  html::after {

<script>
(function(){
  'use strict';
  
  /* ===== 禁用右鍵選單 ===== */
  return false;
  });
  
  /* ===== 禁用複製、剪下、貼上 ===== */
  ['copy','cut','paste'].forEach(function(evt){
    document.addEventListener(evt, function(e){
      e.preventDefault();
      return false;
    });
  });
  
  /* ===== 禁用選取 ===== */
  document.addEventListener('selectstart', function(e){
    if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA' && !e.target.isContentEditable){
      e.preventDefault();
      return false;
    }
  });
  
  /* ===== 禁用拖拽 ===== */
  document.addEventListener('dragstart', function(e){
    e.preventDefault();
    return false;
  });
  
  /* ===== 禁用鍵盤快捷鍵 ===== */
  document.addEventListener('keydown', function(e){
    var key = e.key || e.keyCode;
    var ctrl = e.ctrlKey || e.metaKey;
    var shift = e.shiftKey;
    
    // F12 開發者工具
    if(key === 'F12' || e.keyCode === 123){
      e.preventDefault();
      return false;
    }
    
    // Ctrl+U 查看原始碼
    if(ctrl && (key === 'u' || key === 'U' || e.keyCode === 85)){
      e.preventDefault();
      return false;
    }
    
    // Ctrl+S 另存新檔
    if(ctrl && (key === 's' || key === 'S' || e.keyCode === 83)){
      e.preventDefault();
      return false;
    }
    
    // Ctrl+C 複製
    if(ctrl && (key === 'c' || key === 'C' || e.keyCode === 67)){
      if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA' && !e.target.isContentEditable){
        e.preventDefault();
        return false;
      }
    }
    
    // Ctrl+X 剪下
    if(ctrl && (key === 'x' || key === 'X' || e.keyCode === 88)){
      e.preventDefault();
      return false;
    }
    
    // Ctrl+P 列印
    if(ctrl && (key === 'p' || key === 'P' || e.keyCode === 80)){
      e.preventDefault();
      return false;
    }
    
    // Ctrl+Shift+I / J / C 開發者工具
    if(ctrl && shift && (key === 'I' || key === 'i' || key === 'J' || key === 'j' || key === 'C' || key === 'c' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)){
      e.preventDefault();
      return false;
    }
    
    // Ctrl+Shift+K (Firefox 主控台)
    if(ctrl && shift && (key === 'K' || key === 'k' || e.keyCode === 75)){
      e.preventDefault();
      return false;
    }
    
    // Ctrl+Shift+S (另存)
    if(ctrl && shift && (key === 'S' || key === 's' || e.keyCode === 83)){
      e.preventDefault();
      return false;
    }
    
    // Alt+F4 關閉視窗(無法完全阻止，但可攔截功能鍵)
    // Ctrl+W 關閉分頁(無法完全阻止)
    
  });
  
  /* ===== 禁用圖片另存 ===== */
  return false;
    }
  });
  
  /* ===== 偵測開發者工具開啟(簡易版) ===== */
  var devtoolsOpen = false;
  var threshold = 160;
  setInterval(function(){
    var widthThreshold = window.outerWidth - window.innerWidth > threshold;
    var heightThreshold = window.outerHeight - window.innerHeight > threshold;
    if(widthThreshold || heightThreshold){
      if(!devtoolsOpen){
        devtoolsOpen = true;
        // 可選擇：顯示提示或重新導向
        // alert('請勿使用開發者工具');
      }
    } else {
      devtoolsOpen = false;
    }
  }, 1000);
  
})();
</script>

<body>
<div id="game">
  <div id="hud">
    <span>關卡：<span id="level">1</span></span>
    <span>分數：<span id="score">0</span></span>
    <span>最高：<span id="best">0</span></span>
  </div>
  <div id="status">觀看並記住音符序列</div>
  <div id="board">
    <div class="pad p0" data-pad="0"></div>
    <div class="pad p1" data-pad="1"></div>
    <div class="pad p2" data-pad="2"></div>
    <div class="pad p3" data-pad="3"></div>
    <div id="center">音樂<br>記憶</div>
  </div>
  <div id="startScreen" class="overlay">
    <h1>音樂記憶</h1>
    <p>觀看四個音樂板發光的順序<br>然後按照相同順序點選它們<br>每過一關序列會增加一個音符<br>你能記住多長的旋律？</p>
    <button id="startBtn">開始遊戲</button>
  </div>
  <div id="endScreen" class="overlay hidden">
    <h2>遊戲結束</h2>
    <div class="stats">
      到達關卡：<b id="finalLevel">1</b><br>
      本局分數：<b id="finalScore">0</b><br>
      歷史最高：<b id="finalBest">0</b>
    </div>
    <button id="restartBtn">再來一局</button>
  </div>
</div>
<script>
const AC=window.AudioContext||window.webkitAudioContext;
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume()}
function playPad(pad,dur=.3){
  if(!audioCtx)return;
  const freqs=[261.63,329.63,392,523.25];
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sine';o.frequency.value=freqs[pad];
  g.gain.setValueAtTime(.3,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
  const o2=audioCtx.createOscillator(),g2=audioCtx.createGain();
  o2.type='triangle';o2.frequency.value=freqs[pad]*2;
  g2.gain.setValueAtTime(.1,audioCtx.currentTime);
  g2.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o2.connect(g2);g2.connect(audioCtx.destination);o2.start();o2.stop(audioCtx.currentTime+dur);
}
function playError(){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(200,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(50,audioCtx.currentTime+.3);
  g.gain.setValueAtTime(.2,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.3);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.3);
}
const game={sequence:[],playerIdx:0,level:1,score:0,playing:false,acceptInput:false};
const statusEl=document.getElementById('status');
const levelEl=document.getElementById('level');
const scoreEl=document.getElementById('score');
let best=0;
try{best=parseInt(localStorage.getItem('musicMemory_best')||'0')}catch(e){}
document.getElementById('best').textContent=best;

function flashPad(pad,dur=300){
  return new Promise(res=>{
    const el=document.querySelector('.pad[data-pad="'+pad+'"]');
    el.classList.add('active');
    playPad(pad,dur/1000);
    setTimeout(()=>{el.classList.remove('active');setTimeout(res,100);},dur);
  });
}
async function playSequence(){
  game.acceptInput=false;
  statusEl.textContent='觀看並記住...';
  await new Promise(r=>setTimeout(r,500));
  for(const pad of game.sequence){
    await flashPad(pad,400-Math.min(200,game.level*10));
  }
  game.playerIdx=0;
  game.acceptInput=true;
  statusEl.textContent='換你了！重複序列';
}
function addToSequence(){
  game.sequence.push(Math.floor(Math.random()*4));
}
function playerHit(pad){
  if(!game.acceptInput)return;
  initAudio();
  flashPad(pad,200);
  if(pad===game.sequence[game.playerIdx]){
    game.playerIdx++;
    game.score+=10;
    scoreEl.textContent=game.score;
    if(game.playerIdx>=game.sequence.length){
      game.acceptInput=false;
      game.level++;
      levelEl.textContent=game.level;
      game.score+=50;
      scoreEl.textContent=game.score;
      statusEl.textContent='完美！進入下一關';
      setTimeout(()=>{addToSequence();playSequence();},1000);
    }
  }else{
    playError();
    game.acceptInput=false;
    endGame();
  }
}
function startGame(){
  initAudio();
  game.sequence=[];game.playerIdx=0;game.level=1;game.score=0;
  levelEl.textContent=1;scoreEl.textContent=0;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  game.playing=true;
  addToSequence();
  playSequence();
}
function endGame(){
  game.playing=false;game.acceptInput=false;
  if(game.score>best){best=game.score;try{localStorage.setItem('musicMemory_best',best)}catch(e){}}
  document.getElementById('best').textContent=best;
  document.getElementById('finalLevel').textContent=game.level;
  document.getElementById('finalScore').textContent=game.score;
  document.getElementById('finalBest').textContent=best;
  setTimeout(()=>document.getElementById('endScreen').classList.remove('hidden'),500);
}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('restartBtn').onclick=startGame;
document.querySelectorAll('.pad').forEach(p=>{
  p.addEventListener('pointerdown',e=>{e.preventDefault();playerHit(parseInt(p.dataset.pad));});
});
document.addEventListener('keydown',e=>{
  const map={'q':0,'w':1,'a':2,'s':3,'1':0,'2':1,'3':2,'4':3};
  if(map[e.key.toLowerCase()]!==undefined)playerHit(map[e.key.toLowerCase()]);
});
</script>
</body>
