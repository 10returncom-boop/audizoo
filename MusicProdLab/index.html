<script>
/* ============ Audio Engine ============ */
let AC=null, masterGain=null, audioOn=false;
function ensureAudio(){
  if(AC){ if(AC.state==='suspended')AC.resume(); return; }
  AC = new (window.AudioContext||window.webkitAudioContext)();
  masterGain = AC.createGain();
  masterGain.gain.value = 0.2;
  masterGain.connect(AC.destination);
}
function toggleAudio(){
  audioOn = !audioOn;
  const b = document.getElementById('audioToggle');
  b.textContent = audioOn ? '🔊 音效開' : '🔇 音效';
  b.classList.toggle('on', audioOn);
  if(audioOn){ ensureAudio(); }
}
function play(freq, dur=0.8, type='sine', when=0){
  if(!audioOn){ alert('請先點右上角 🔊 開音效'); return; }
  ensureAudio();
  const t = AC.currentTime + when;
  const o = AC.createOscillator();
  const g = AC.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(0.5, t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+dur);
}
// Note name to freq
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function noteFreq(note, octave=4){
  const n = NOTES.indexOf(note);
  if(n<0) return 440;
  const midi = (octave+1)*12 + n;
  return 440 * Math.pow(2, (midi-69)/12);
}
function freqNote(freq){
  const midi = Math.round(12*Math.log2(freq/440))+69;
  const n = midi % 12;
  const oct = Math.floor(midi/12)-1;
  return NOTES[n]+oct;
}

/* ============ Tool Registry ============ */
const TOOLS = [];
let TID = 0;
function tool(cat, name, desc, body, init){ TOOLS.push({id:++TID, cat, name, desc, body, init}); }

/* ===== 音階音高 1-12 ===== */
tool('音階','播放指定音','點擊琴鍵播放',
  `<div class="piano">${['C','D','E','F','G','A','B'].map(n=>`<div class="k" onclick="play(noteFreq('${n}',4))">${n}</div>`).join('')}</div>`,
  ``);

tool('音階','C 大調音階','C D E F G A B',
  `<button class="primary" onclick="playScale('C major')">播放</button><div class="out">C4 D4 E4 F4 G4 A4 B4 C5</div>`,
  `window.playScale = (n) => { const s=['C','D','E','F','G','A','B','C']; s.forEach((x,i)=>play(noteFreq(x, i===7?5:4), 0.5, 'sine', i*0.3)) }`);

tool('音階','五聲音階','C D E G A',
  `<button class="primary" onclick="playPent()">播放</button><div class="out">C D E G A（無半音，永遠好聽）</div>`,
  `window.playPent = () => ['C','D','E','G','A','C'].forEach((n,i)=>play(noteFreq(n, i===5?5:4), 0.5, 'triangle', i*0.25))`);

tool('音階','藍調音階','含藍音',
  `<button class="primary" onclick="playBla()">播放</button><div class="out">C Eb F Gb G Bb</div>`,
  `window.playBla = () => ['C','D#','F','F#','G','A#'].forEach((n,i)=>play(noteFreq(n,4), 0.4, 'sawtooth', i*0.2))`);

tool('音階','自然小調','A B C D E F G',
  `<button class="primary" onclick="playNat()">播放</button><div class="out">A B C D E F G A（陰鬱）</div>`,
  `window.playNat = () => ['A','B','C','D','E','F','G','A'].forEach((n,i)=>play(noteFreq(n, i===7?5:4), 0.5, 'sine', i*0.3))`);

tool('音階','和聲小調','升第七音',
  `<button class="primary" onclick="playHar()">播放</button><div class="out">A B C D E F G# A</div>`,
  `window.playHar = () => ['A','B','C','D','E','F','G#','A'].forEach((n,i)=>play(noteFreq(n, i===7?5:4), 0.5, 'sine', i*0.3))`);

tool('音階','頻率→音名','計算 MIDI',
  `<div class="row"><input type="number" value="440" id="m7-f"></div><button class="primary" onclick="m7()">計算</button><div class="out" id="m7-o">—</div>`,
  `window.m7 = () => { const f=+document.getElementById('m7-f').value; document.getElementById('m7-o').textContent = freqNote(f) + ' · ' + f + 'Hz' }`);

tool('音階','音名→頻率','MIDI 換算',
  `<div class="row"><select id="m8-n">${NOTES.map(n=>`<option>${n}</option>`).join('')}</select><input type="number" value="4" id="m8-o"></div><button class="primary" onclick="m8()">計算</button><div class="out" id="m8-o">—</div>`,
  `window.m8 = () => { const n=document.getElementById('m8-n').value, o=+document.getElementById('m8-o').value; document.getElementById('m8-o').textContent = noteFreq(n,o).toFixed(1)+' Hz' }`);

tool('音階','八度轉換','頻率×2',
  `<div class="row"><input type="number" value="261.63" id="m9-f"></div><button class="primary" onclick="m9()">產生</button><div class="out" id="m9-o">—</div>`,
  `window.m9 = () => { const f=+document.getElementById('m9-f').value; document.getElementById('m9-o').textContent = \`低八度: \${(f/2).toFixed(2)}Hz · 高八度: \${(f*2).toFixed(2)}Hz\` }`);

tool('音階','半音階','12 半音',
  `<button class="primary" onclick="playChrom()">播放</button><div class="out">C C# D D# E F F# G G# A A# B</div>`,
  `window.playChrom = () => NOTES.forEach((n,i)=>play(noteFreq(n, i===0?4:4), 0.3, 'sine', i*0.15))`);

tool('音階','音程距離','半音數',
  `<div class="row"><select id="m11-a">${NOTES.map(n=>`<option>${n}</option>`).join('')}</select><select id="m11-b">${NOTES.map(n=>`<option>${n}</option>`).join('')}</select></div><button class="primary" onclick="m11()">計算</button><div class="out" id="m11-o">—</div>`,
  `window.m11 = () => { const a=NOTES.indexOf(document.getElementById('m11-a').value), b=NOTES.indexOf(document.getElementById('m11-b').value); const d=Math.abs(a-b); const names=['同音','小二度','大二度','小三度','大三度','純四度','增四度','純五度','小六度','大六度','小七度','大七度']; document.getElementById('m11-o').textContent = \`\${d} 半音 = \${names[d]}\` }`);

tool('音階','音階比較','大小調',
  `<div class="out" style="line-height:1.8">大調: 全全半全全全半<br>小調: 全半全全半全全</div>`,
  ``);

/* ===== 和弦 13-24 ===== */
tool('和弦','大三和弦','1 3 5',
  `<button class="primary" onclick="playChord(['C','E','G'],'triangle')">播放 C</button><div class="out">C E G · 明亮開放</div>`,
  ``);

tool('和弦','小三和弦','1 b3 5',
  `<button class="primary" onclick="playChord(['C','D#','G'],'sine')">播放 Cm</button><div class="out">C Eb G · 憂鬱</div>`,
  ``);

tool('和弦','減三和弦','1 b3 b5',
  `<button class="primary" onclick="playChord(['C','D#','F#'],'triangle')">播放 Cdim</button><div class="out">C Eb Gb · 緊張</div>`,
  ``);

tool('和弦','增三和弦','1 3 #5',
  `<button class="primary" onclick="playChord(['C','E','G#'],'triangle')">播放 Caug</button><div class="out">C E G# · 懸浮</div>`,
  ``);

tool('和弦','大七和弦','1 3 5 7',
  `<button class="primary" onclick="playChord(['C','E','G','B'],'sine')">播放 Cmaj7</button><div class="out">C E G B · 柔和爵士</div>`,
  ``);

tool('和弦','小七和弦','1 b3 5 b7',
  `<button class="primary" onclick="playChord(['C','D#','G','A#'],'sine')">播放 Cm7</button><div class="out">C Eb G Bb · 順暢</div>`,
  ``);

tool('和弦','屬七和弦','1 3 5 b7',
  `<button class="primary" onclick="playChord(['C','E','G','A#'],'triangle')">播放 C7</button><div class="out">C E G Bb · 經典 blues</div>`,
  ``);

tool('和弦','掛留和弦 sus4','1 4 5',
  `<button class="primary" onclick="playChord(['C','F','G'],'sine')">播放 Csus4</button><div class="out">C F G · 懸而未決</div>`,
  ``);

tool('和弦','六和弦','1 3 5 6',
  `<button class="primary" onclick="playChord(['C','E','G','A'],'sine')">播放 C6</button><div class="out">C E G A · 復古</div>`,
  ``);

tool('和弦','九和弦','1 3 5 b7 9',
  `<button class="primary" onclick="playChord(['C','E','G','A#','D'],'sine')">播放 C9</button><div class="out">C E G Bb D · 爵士</div>`,
  ``);

tool('和弦','經典進行','I-V-vi-IV',
  `<button class="primary" onclick="playProg()">播放</button><div class="out">C → G → Am → F（數千首流行歌）</div>`,
  `window.playProg = () => { const chords=[['C','E','G'],['G','B','D'],['A','C','E'],['F','A','C']]; chords.forEach((ch,i)=>ch.forEach(n=>play(noteFreq(n,4),1.5,'sine',i*0.5))) }`);

tool('和弦','卡農進行','Pachelbel',
  `<button class="primary" onclick="playCanon()">播放</button><div class="out">D A Bm F#m G D G A</div>`,
  `window.playCanon = () => { const chords=[['D','F#','A'],['A','C#','E'],['B','D','F#'],['F#','A','C#'],['G','B','D'],['D','F#','A'],['G','B','D'],['A','C#','E']]; chords.forEach((ch,i)=>ch.forEach(n=>play(noteFreq(n,4),1,'sine',i*0.5))) }`);

window.playChord = (notes, type='sine') => notes.forEach((n,i)=>play(noteFreq(n,4),1.5,type,i*0.05));

/* ===== 節奏 25-34 ===== */

tool('合成器','低通濾波器','LP Filter',
  `<div class="row"><label style="font-size:10px">Cutoff<input type="range" min="100" max="5000" value="1000" id="m47-f"></label></div><button class="primary" onclick="m47()">播放</button><div class="out" id="m47-o">—</div>`,
  `window.m47 = () => { if(!audioOn){alert('先開音效');return} ensureAudio(); const f=+document.getElementById('m47-f').value; const o=AC.createOscillator(); const g=AC.createGain(); const fl=AC.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=f; o.type='sawtooth'; o.frequency.value=440; o.connect(fl); fl.connect(g); g.connect(masterGain); o.start(); o.stop(AC.currentTime+1.5); document.getElementById('m47-o').textContent='LP '+f+'Hz'; setTimeout(()=>o.disconnect(),2000) }`);

tool('合成器','顫音 Tremolo','音量抖動',

tool('合成器','反向音','Reverse',

/* ============ Renderer ============ */
const CATS = ['音階','和弦','節奏','樂理','合成器','練習'];
function buildSidebar(){
  const sb=document.getElementById('sidebar');
  sb.innerHTML='<h4>分類</h4><button class="cat-btn active" data-cat="all" onclick="setCat(\'all\')">全部 60</button>'+CATS.map(c=>{
    const n=TOOLS.filter(t=>t.cat===c).length;
    return `<button class="cat-btn" data-cat="${c}" onclick="setCat('${c}')">${c} ${n}</button>`;
  }).join('');
}
let curCat='all';
function setCat(c){curCat=c;document.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('active',b.dataset.cat===c));render();}
function render(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const list=TOOLS.filter(t=>(curCat==='all'||t.cat===curCat)&&(!q||t.name.toLowerCase().includes(q)||t.desc.toLowerCase().includes(q)));
  document.getElementById('count').textContent=list.length+' / 60';
  document.getElementById('grid').innerHTML=list.map(t=>`
    <div class="tool">
      <h3><span class="num">${String(t.id).padStart(2,'0')}</span>${t.name}</h3>
      <div class="desc">${t.desc}</div>
      <div class="body">${t.body}</div>
    </div>`).join('');
}
function toggleTheme(){document.body.classList.toggle('light');document.querySelector('.header-actions button:last-child').textContent=document.body.classList.contains('light')?'☀️':'🌙'}
buildSidebar();
render();
</script>
